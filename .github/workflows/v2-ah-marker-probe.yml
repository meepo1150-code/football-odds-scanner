name: Validation v2 AH Marker Probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: validation-v2-ah-marker-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - name: Verify marker diagnostic contract
        run: pytest -q tests/test_v2_ah_marker_probe.py tests/test_v2_mainline_observer.py
      - name: Probe AH mainLine player markers across locked universes
        run: python -m odds_scanner.v2_ah_marker_probe
      - name: Persist diagnostic evidence
        run: |
          set -euo pipefail
          cp reports/v2_ah_marker_probe.json /tmp/v2-ah-marker-probe.json
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v2-ah-marker-probe.json reports/v2_ah_marker_probe.json
            git add -- reports/v2_ah_marker_probe.json
            git diff --cached --quiet && exit 0
            git commit -m '[skip ci] Update validation v2 AH marker diagnostic'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
          done
          exit 1

# Diagnostic-only manual probe. Merging or editing research code cannot spend
# current-odds quota. A manual run spends two current-odds requests (one exact
# five-league batch per universe) and cannot alter the frozen v2 rules.
