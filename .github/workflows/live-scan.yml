name: Live Odds Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 10 * * *'
permissions:
  contents: write
concurrency:
  group: football-odds-live-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Run fail-closed live scan
        env:
          FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
        run: |
          if [ -z "$FIVE_DOLLAR_FOOTBALL_API_KEY" ]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('reports/today.json'); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'schema_version':'3.2','status':'API_KEY_NOT_CONFIGURED','generated_at':datetime.now(timezone.utc).isoformat(),'matches_scanned':0,'qualifying':0,'candidates':[],'message':'NO QUALIFYING BETS','reason':'GitHub secret FIVE_DOLLAR_FOOTBALL_API_KEY is required for the live Bet365 multi-market scan.'},indent=2),encoding='utf-8')
          PY
          else
            python -m odds_scanner.run_live_scan
          fi
      - name: Commit scanner report
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/today.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update live odds scan'
          git pull --rebase origin main
          git push
