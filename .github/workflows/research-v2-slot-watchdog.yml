name: Research V2 Independent Slot Watchdog
on:
  workflow_dispatch:
  schedule:
    # Independent recovery path. Offset from the primary workflow so one delayed
    # workflow definition does not remain the only trigger source.
    # Weekday 21:00 Bangkok: +10,+30,+50,+70,+90,+110,+130 minutes.
    - cron: '10,30,50 11,12,14,15 * * 1-5'
    - cron: '10,30 16 * * 1-5'
    # Tue-Sat 00:00 Bangkok: +10,+30,+50,+70,+90,+110,+130 minutes.
    - cron: '10,30,50 17,18 * * 1-5'
    - cron: '10,30 19 * * 1-5'
    # Weekend hourly 18-22 Bangkok plus 12/15 recovery heartbeats.
    - cron: '10,30,50 5,8,11,12,13,14,15 * * 6,0'
    - cron: '10,30 6,9,16 * * 6,0'
permissions: {contents: write}
concurrency:
  group: research-v2-collectors
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Recover current canonical slot if still unobserved
        env:
          ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}'
          PROPLINE_API_KEY: '${{ secrets.PROPLINE_API_KEY }}'
          RESEARCH_V2_FORCE_RUN: 'false'
        run: python -m odds_scanner.research_v2_slot_recovery
      - name: Build movement features
        run: python -m odds_scanner.research_v2_movement
      - name: Persist raw evidence and rebuild against latest main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          stage=$(mktemp -d)
          paths=(data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl data/normalized/research_v2_slot_ledger.jsonl reports/pinnwire_research_v2_status.json reports/propline_research_v2_status.json reports/europe_pinnacle_research_v2_status.json)
          for f in "${paths[@]}"; do if test -f "$f"; then mkdir -p "$stage/$(dirname "$f")"; cp "$f" "$stage/$f"; fi; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m odds_scanner.research_v2_persistence "$stage"
            python -m odds_scanner.research_v2_movement
            python -m odds_scanner.research_v2_pattern_stats
            python -m odds_scanner.legacy_propline_recovery
            python -m odds_scanner.research_v2_operational_audit
            git add -f data/normalized reports
            git diff --cached --quiet && exit 0
            git commit -m 'data: merge Research V2 evidence and rebuild [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          echo 'Failed to persist Research V2 output' >&2
          exit 1
