name: Research V2 Independent Slot Watchdog
on:
  workflow_dispatch:
  schedule:
    # Independent recovery path. Offset from the primary workflow so one delayed
    # workflow definition does not remain the only trigger source.
    # Weekday 21:00 Bangkok: +10,+30,+50,+70,+90,+110,+130 minutes.
    - cron: '10,30,50 14,15 * * 1-5'
    - cron: '10,30 16 * * 1-5'
    # Tue-Sat 00:00 Bangkok: +10,+30,+50,+70,+90,+110,+130 minutes.
    - cron: '10,30,50 17,18 * * 1-5'
    - cron: '10,30 19 * * 1-5'
    # Weekend 12/15/18/20 Bangkok recovery heartbeats, kept inside 150 minutes.
    - cron: '10,30,50 5,8,11,13 * * 6,0'
    - cron: '10,30 6,9,12,14 * * 6,0'
permissions: {contents: write}
concurrency:
  group: europe-pinnacle-research-v2
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Recover current canonical slot if still unobserved
        env:
          ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}'
          RESEARCH_V2_FORCE_RUN: 'false'
        run: python -m odds_scanner.europe_pinnacle_discovery
      - name: Build movement features
        run: python -m odds_scanner.research_v2_movement
      - name: Persist recovery evidence safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          paths=(reports/europe_pinnacle_research_v2_status.json reports/research_v2_movement_status.json data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl data/normalized/research_v2_movement_features.jsonl data/normalized/research_v2_slot_ledger.jsonl)
          rm -rf /tmp/research-v2-watchdog && mkdir -p /tmp/research-v2-watchdog
          for f in "${paths[@]}"; do if test -e "$f"; then mkdir -p "/tmp/research-v2-watchdog/$(dirname "$f")"; cp "$f" "/tmp/research-v2-watchdog/$f"; fi; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in "${paths[@]}"; do if test -e "/tmp/research-v2-watchdog/$f"; then mkdir -p "$(dirname "$f")"; cp "/tmp/research-v2-watchdog/$f" "$f"; git add -f -- "$f"; fi; done
            git diff --cached --quiet && exit 0
            git commit -m 'data: watchdog recover Pinnacle research v2 [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
