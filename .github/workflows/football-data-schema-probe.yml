name: Football-Data Multi-Season Schema Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/football_data_schema_probe.py'
      - '.github/workflows/football-data-schema-probe.yml'

permissions:
  contents: write

concurrency:
  group: football-data-schema-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Probe Football-Data multi-season schemas
        run: python -m odds_scanner.football_data_schema_probe
      - name: Persist schema report
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ -e reports/football_data_schema_probe.json ] || exit 1
          cp reports/football_data_schema_probe.json /tmp/football_data_schema_probe.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/football_data_schema_probe.json reports/football_data_schema_probe.json
            git add -f reports/football_data_schema_probe.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update Football-Data schema probe [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
