name: PinnWire Current AH Probe
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,14 * * 1-5' # 18:00,21:00 Bangkok weekdays
    - cron: '0 5,8,11,12,13,14,15 * * 0,6' # 12:00,15:00,18:00-22:00 Bangkok weekends
  push:
    branches: [main]
    paths: ['src/odds_scanner/pinnwire_probe.py','.github/workflows/pinnwire-probe.yml']
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Collect PinnWire Research V2
        env:
          PINNWIRE_V2_SCAN: 'true'
        run: python -m odds_scanner.pinnwire_probe
      - name: Recover with PropLine when PinnWire is unavailable
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          python - <<'PY'
          import json,subprocess
          r=json.load(open('reports/pinnwire_research_v2_status.json',encoding='utf-8'))
          if r.get('status') not in {'RESEARCH_V2_OBSERVED','ZERO_FIXTURES'}:
              subprocess.run(['python','-m','odds_scanner.propline_research_v2'],check=True)
          PY
      - name: Rebuild movement and statistics from latest snapshots
        run: |
          python -m odds_scanner.research_v2_movement
          python -m odds_scanner.research_v2_pattern_stats
      - name: Persist Research V2 data
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/pinnwire/data/normalized /tmp/pinnwire/reports
          test -e data/normalized/europe_pinnacle_research_v2_audit.jsonl && cp data/normalized/europe_pinnacle_research_v2_audit.jsonl /tmp/pinnwire/data/normalized/
          test -e reports/propline_research_v2_status.json && cp reports/propline_research_v2_status.json /tmp/pinnwire/reports/
          if test -s data/normalized/europe_pinnacle_research_v2_snapshots.jsonl; then cp data/normalized/europe_pinnacle_research_v2_snapshots.jsonl /tmp/pinnwire/data/normalized/; fi
          cp data/normalized/research_v2_pattern_outcomes.jsonl /tmp/pinnwire/data/normalized/
          cp reports/pinnwire_research_v2_status.json /tmp/pinnwire/reports/
          cp reports/research_v2_pattern_statistics.json /tmp/pinnwire/reports/
          cp reports/research_v2_movement_status.json /tmp/pinnwire/reports/
          cp data/normalized/research_v2_movement_features.jsonl /tmp/pinnwire/data/normalized/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/normalized reports
            test -e /tmp/pinnwire/data/normalized/europe_pinnacle_research_v2_audit.jsonl && cp /tmp/pinnwire/data/normalized/europe_pinnacle_research_v2_audit.jsonl data/normalized/
            test -e /tmp/pinnwire/reports/propline_research_v2_status.json && cp /tmp/pinnwire/reports/propline_research_v2_status.json reports/
            if test -s /tmp/pinnwire/data/normalized/europe_pinnacle_research_v2_snapshots.jsonl; then cp /tmp/pinnwire/data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/; fi
            cp /tmp/pinnwire/data/normalized/research_v2_pattern_outcomes.jsonl data/normalized/
            cp /tmp/pinnwire/reports/pinnwire_research_v2_status.json reports/
            cp /tmp/pinnwire/reports/research_v2_pattern_statistics.json reports/
            cp /tmp/pinnwire/reports/research_v2_movement_status.json reports/
            cp /tmp/pinnwire/data/normalized/research_v2_movement_features.jsonl data/normalized/
            git add -f data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl reports/propline_research_v2_status.json reports/pinnwire_research_v2_status.json reports/research_v2_pattern_statistics.json reports/research_v2_movement_status.json data/normalized/research_v2_pattern_outcomes.jsonl data/normalized/research_v2_movement_features.jsonl
            git diff --cached --quiet && break
            git commit -m 'data: collect PinnWire Research V2'
            git push origin HEAD:main && break
            sleep 3
          done
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json,sys
          p='reports/pinnwire_research_v2_status.json'
          r=json.load(open(p,encoding='utf-8'))
          p={}
          try: p=json.load(open('reports/propline_research_v2_status.json',encoding='utf-8'))
          except Exception: pass
          primary_ok=r.get('status') in {'RESEARCH_V2_OBSERVED','ZERO_FIXTURES'}
          fallback_ok=p.get('football_day')==r.get('football_day') and p.get('status') in {'RESEARCH_V2_OBSERVED','ZERO_USABLE_FIXTURES'}
          ok=primary_ok or fallback_ok
          print(json.dumps({'operational_status':r.get('status'),'fallback_status':p.get('status'),'fallback_day':p.get('football_day'),'requests_used':r.get('requests_used'),'request_attempts':r.get('request_attempts'),'rate_limit_responses':r.get('rate_limit_responses')},ensure_ascii=False))
          sys.exit(0 if ok else 1)
          PY
