name: PinnWire Current AH Probe
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,14 * * 1-5'
    - cron: '0 5,8,11,12,13,14,15 * * 0,6'
  push:
    branches: [main]
    paths: ['src/odds_scanner/pinnwire_probe.py','.github/workflows/pinnwire-probe.yml']
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Collect PinnWire Research V2
        env:
          PINNWIRE_V2_SCAN: 'true'
        run: python -m odds_scanner.pinnwire_probe
      - name: Persist Research V2 data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/normalized/europe_pinnacle_research_v2_snapshots.jsonl reports/pinnwire_research_v2_status.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: collect PinnWire Research V2'
          git pull --rebase origin main
          git push origin HEAD:main
