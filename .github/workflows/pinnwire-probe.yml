name: PinnWire Current AH Probe
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,14 * * 1-5' # 18:00,21:00 Bangkok weekdays
    - cron: '0 5,8,11,12,13,14,15 * * 0,6' # 12:00,15:00,18:00-22:00 Bangkok weekends
  push:
    branches: [main]
    paths: ['src/odds_scanner/pinnwire_probe.py','.github/workflows/pinnwire-probe.yml']
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Collect PinnWire Research V2
        env:
          PINNWIRE_V2_SCAN: 'true'
        run: python -m odds_scanner.pinnwire_probe
      - name: Rebuild statistics from latest snapshots
        run: python -m odds_scanner.research_v2_pattern_stats
      - name: Persist Research V2 data
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/pinnwire/data/normalized /tmp/pinnwire/reports
          cp data/normalized/europe_pinnacle_research_v2_snapshots.jsonl /tmp/pinnwire/data/normalized/
          cp data/normalized/research_v2_pattern_outcomes.jsonl /tmp/pinnwire/data/normalized/
          cp reports/pinnwire_research_v2_status.json /tmp/pinnwire/reports/
          cp reports/research_v2_pattern_statistics.json /tmp/pinnwire/reports/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/normalized reports
            cp /tmp/pinnwire/data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/
            cp /tmp/pinnwire/data/normalized/research_v2_pattern_outcomes.jsonl data/normalized/
            cp /tmp/pinnwire/reports/pinnwire_research_v2_status.json reports/
            cp /tmp/pinnwire/reports/research_v2_pattern_statistics.json reports/
            git add -f data/normalized/europe_pinnacle_research_v2_snapshots.jsonl reports/pinnwire_research_v2_status.json reports/research_v2_pattern_statistics.json data/normalized/research_v2_pattern_outcomes.jsonl
            git diff --cached --quiet && exit 0
            git commit -m 'data: collect PinnWire Research V2'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
