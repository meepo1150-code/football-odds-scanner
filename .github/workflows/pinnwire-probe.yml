name: PinnWire Current AH Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/odds_scanner/pinnwire_probe.py','.github/workflows/pinnwire-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python -m odds_scanner.pinnwire_probe
