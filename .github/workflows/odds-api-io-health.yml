name: Odds API IO Provider Health
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/odds_api_io_provider.py'
      - 'tests/test_odds_api_io_provider.py'
      - '.github/workflows/odds-api-io-health.yml'
permissions:
  contents: write
concurrency:
  group: odds-api-io-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Probe Bet365 timestamped current-market candidate
        run: python -c "from pathlib import Path; from odds_scanner.odds_api_io_provider import write_health; print(write_health(Path('.')))"
      - name: Commit provider health safely
        run: |
          set -euo pipefail
          cp reports/odds_api_io_health.json /tmp/odds_api_io_health.json
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp /tmp/odds_api_io_health.json reports/odds_api_io_health.json
            git add -- reports/odds_api_io_health.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update Odds-API.io provider health'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying from latest main"
          done
          exit 1
