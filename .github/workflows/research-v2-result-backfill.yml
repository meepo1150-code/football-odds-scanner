name: Research V2 Result Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['controls/research_v2_result_backfill_run_token.txt']
  schedule:
    # Result-only heartbeats: 00:00, 03:00, 06:00, 09:00 Bangkok.
    - cron: '0 17,20,23,2 * * *'
permissions:
  contents: write
concurrency:
  group: research-v2-result-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Backfill matured exact-ID results from already mapped daily fixtures
        run: python -m odds_scanner.daily_fixture_result_backfill
      - name: Backfill matured exact-ID forward-validation results
        run: python -m odds_scanner.v2_forward_result_backfill
      - name: Refresh settlement performance, pattern statistics, and readiness
        run: |
          python -m odds_scanner.v2_forward_performance
          python -m odds_scanner.research_v2_pattern_stats
          python -m odds_scanner.v2_forward_readiness
      - name: Persist result evidence safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/result-backfill
          paths=(reports/research_v2_daily_result_backfill.json data/normalized/oddspapi_finished_results.jsonl data/normalized/v2_forward_settlements.jsonl reports/v2_forward_result_backfill.json reports/v2_forward_performance.json reports/v2_forward_readiness.json data/normalized/research_v2_pattern_outcomes.jsonl reports/research_v2_pattern_statistics.json)
          for path in "${paths[@]}"; do if test -e "$path"; then mkdir -p "/tmp/result-backfill/$(dirname "$path")"; cp "$path" "/tmp/result-backfill/$path"; fi; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for path in "${paths[@]}"; do if test -e "/tmp/result-backfill/$path"; then mkdir -p "$(dirname "$path")"; cp "/tmp/result-backfill/$path" "$path"; git add -f -- "$path"; fi; done
            git diff --cached --quiet && exit 0
            git commit -m 'data: overnight Research V2 result backfill [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
# This workflow intentionally does NOT call /fixtures or odds endpoints.
# It uses exact fixture_id -> Flashscore mappings already persisted by the daily sync.
# Result heartbeats reduce FT pending latency without spending OddsPAPI odds quota.
# Pattern/performance outputs remain descriptive research only, never betting recommendations.
