name: Validation v2 Forward Performance
on:
  workflow_dispatch:
  schedule:
    - cron: '47 1,7,13,19 * * *'
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/v2_forward_performance.py'
      - 'src/odds_scanner/v2_forward_readiness.py'
      - 'tests/test_v2_forward_performance.py'
      - 'tests/test_v2_forward_readiness.py'
      - 'reports/v2_forward_preregistration.json'
      - 'data/normalized/v2_forward_entries.jsonl'
      - 'data/normalized/oddspapi_finished_results.jsonl'
      - '.github/workflows/v2-forward-performance.yml'
permissions:
  contents: write
concurrency:
  group: validation-v2-forward-performance
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - name: Verify forward settlement and readiness contracts
        run: pytest -q tests/test_asian_settlement.py tests/test_v2_forward_performance.py tests/test_v2_forward_readiness.py
      - name: Settle exact fixture-id forward entries and refresh metrics
        run: python -m odds_scanner.v2_forward_performance
      - name: Refresh frozen forward-readiness gates
        run: python -m odds_scanner.v2_forward_readiness
      - name: Persist performance evidence safely
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-performance
          if [ -f reports/v2_forward_performance.json ]; then cp reports/v2_forward_performance.json /tmp/v2-performance/performance.json; fi
          if [ -f reports/v2_forward_readiness.json ]; then cp reports/v2_forward_readiness.json /tmp/v2-performance/readiness.json; fi
          if [ -f data/normalized/v2_forward_settlements.jsonl ]; then cp data/normalized/v2_forward_settlements.jsonl /tmp/v2-performance/settlements.jsonl; fi
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            if [ -f /tmp/v2-performance/performance.json ]; then cp /tmp/v2-performance/performance.json reports/v2_forward_performance.json; fi
            if [ -f /tmp/v2-performance/readiness.json ]; then cp /tmp/v2-performance/readiness.json reports/v2_forward_readiness.json; fi
            if [ -f /tmp/v2-performance/settlements.jsonl ]; then cp /tmp/v2-performance/settlements.jsonl data/normalized/v2_forward_settlements.jsonl; fi
            for path in reports/v2_forward_performance.json reports/v2_forward_readiness.json data/normalized/v2_forward_settlements.jsonl; do
              if [ -f "$path" ]; then git add -- "$path"; fi
            done
            git diff --cached --quiet && exit 0
            git commit -m '[skip ci] Update validation v2 forward performance evidence'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
          done
          exit 1

# This workflow performs zero OddsPapi current-odds requests. It only reads the
# immutable forward entry ledger plus persisted exact fixture-id result evidence,
# settles the frozen lines, computes frozen metrics, and refreshes readiness.
