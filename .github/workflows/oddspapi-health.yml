name: OddsPapi Current Provider Health
on:
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * *'
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/oddspapi_provider.py'
      - 'tests/test_oddspapi_provider.py'
      - 'src/odds_scanner/provider_capabilities.py'
      - 'tests/test_provider_capabilities.py'
      - '.github/workflows/oddspapi-health.yml'
permissions:
  contents: write
concurrency:
  group: oddspapi-provider-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Probe timestamped Bet365 candidate fail-closed
        run: python -c "from pathlib import Path; from odds_scanner.oddspapi_provider import write_health; print(write_health(Path('.')))"
      - name: Commit owned health report safely
        run: |
          set -euo pipefail
          cp reports/oddspapi_health.json /tmp/oddspapi_health.json
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp /tmp/oddspapi_health.json reports/oddspapi_health.json
            git add -- reports/oddspapi_health.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update OddsPapi provider health'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
          done
          exit 1

# Activation probe marker: rerun after configuring ODDSPAPI_KEY.
