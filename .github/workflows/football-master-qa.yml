name: Football Master Offline QA

on:
  pull_request:
    paths:
      - 'data/master/**'
      - 'config/league_selection_v1.json'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/football-master-qa.yml'
  push:
    branches: ['feature/league-selection-v1-20261008']
    paths:
      - 'data/master/**'
      - 'tests/**'
      - '.github/workflows/football-master-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Rebuild and validate reviewed source data
        run: |
          python data/master/build_uefa_registry.py
          python data/master/validate_uefa_master.py --write-report
          git diff --exit-code -- data/master
      - name: Master integrity and evidence regression tests
        run: python -m unittest discover -s data/master -p 'test_uefa_registry.py' -v
      - name: Scanner fixture regression tests
        run: python -m pytest -q
