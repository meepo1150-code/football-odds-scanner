name: OddsPapi Historical Data Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/normalized/oddspapi_history_ticks.jsonl'
      - 'src/odds_scanner/oddspapi_history_audit.py'
      - 'tests/test_oddspapi_history_audit.py'
      - '.github/workflows/oddspapi-history-audit.yml'
permissions:
  contents: write
concurrency:
  group: oddspapi-history-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m odds_scanner.oddspapi_history_audit
      - name: Commit audit safely
        run: |
          set -euo pipefail
          cp reports/oddspapi_history_audit.json /tmp/oddspapi_history_audit.json
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp /tmp/oddspapi_history_audit.json reports/oddspapi_history_audit.json
            git add -f -- reports/oddspapi_history_audit.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update OddsPapi historical data audit [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
