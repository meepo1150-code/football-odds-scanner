name: Validation v2 Pipeline Health
on:
  workflow_dispatch:
  schedule:
    - cron: '50 2,8,14,20 * * *'
  workflow_run:
    workflows:
      - 'Validation v2 Main-Line Observer'
      - 'Validation v2 Forward Result Backfill'
      - 'Validation v2 Forward Performance'
      - 'OddsPapi Quota Health'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/v2_pipeline_health.py'
      - 'tests/test_v2_pipeline_health.py'
      - '.github/workflows/v2-pipeline-health.yml'
permissions:
  contents: write
concurrency:
  group: validation-v2-pipeline-health
  cancel-in-progress: false
jobs:
  health:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_v2_pipeline_health.py
      - name: Build operational health from persisted evidence only
        run: python -m odds_scanner.v2_pipeline_health
      - name: Persist pipeline health
        run: |
          set -euo pipefail
          cp reports/v2_pipeline_health.json /tmp/v2-pipeline-health.json
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v2-pipeline-health.json reports/v2_pipeline_health.json
            git add -- reports/v2_pipeline_health.json
            git diff --cached --quiet && exit 0
            git commit -m '[skip ci] Update validation v2 operational health'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

# Zero provider calls. This report summarizes operational collection health only;
# it cannot pass/fail or modify any frozen research gate. Successful observer,
# result, performance, and quota workflows trigger an immediate health refresh;
# failed upstream workflows do not overwrite the last persisted evidence. The
# narrow push trigger seeds the report when this health engine itself changes.
