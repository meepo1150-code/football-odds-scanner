name: Historical artifact isolated import
on:
  push:
    branches:
      - data/historical-import-38901047977
    paths:
      - .github/workflows/historical-artifact-import-38901047977.yml
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact existing artifact (no odds API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38901047977 --repo ${{ github.repository }} --name manual-historical-38901047977-1 --dir /tmp/historical-38901047977
      - name: Validate and import historical records
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          source=pathlib.Path('/tmp/historical-38901047977')
          print('Artifact files:', [str(x.relative_to(source)) for x in source.rglob('*') if x.is_file()][:12])
          report=json.loads((source/'report.json').read_text())
          manifest=json.loads((source/'manifest.json').read_text())
          assert report['status']=='COMPLETED' and not report['errors']
          assert report['research_only'] is True and report['production_writes']==0
          assert manifest['requested_target_slots']==348
          PY
          cd /tmp/historical-38901047977
          zip -q -r /tmp/historical-38901047977.zip report.json manifest.json
          cd -
          python scripts/import_historical_artifact.py /tmp/historical-38901047977.zip
          python - <<'PY'
          import json
          p='data/historical/reconstructed_ah_slots.jsonl'
          rows=[json.loads(x) for x in open(p)]
          assert len(rows)==105
          assert all(x['mainline_verified'] is False and x['promotion_eligible'] is False for x in rows)
          assert len({(x['fixture_id'],x['bookmaker'],x['slot_utc'],x['market']) for x in rows})==105
          print('VALIDATED HISTORICAL ROWS:',len(rows))
          PY
      - name: Commit isolated dataset to import branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/historical/reconstructed_ah_slots.jsonl
          git diff --cached --exit-code && exit 0
          git commit -m "data: import 105 historical AH slots from run 38901047977 [skip ci]"
          git push
