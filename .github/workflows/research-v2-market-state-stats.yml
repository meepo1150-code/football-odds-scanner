name: Research V2 Market State Stats
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'controls/research_v2_stats_rebuild_token.txt'
      - 'src/odds_scanner/research_v2_*.py'
      - 'src/odds_scanner/asian_settlement.py'
      - 'src/odds_scanner/legacy_propline_recovery.py'
      - 'data/normalized/*results*.jsonl'
      - '.github/workflows/research-v2-market-state-stats.yml'
permissions: {contents: write}
concurrency: {group: research-v2-derived, cancel-in-progress: false}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Rebuild and persist from latest canonical evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A missing canonical snapshot set must never overwrite retained FT statistics.
            if ! test -s data/normalized/europe_pinnacle_research_v2_snapshots.jsonl; then
              echo 'BLOCKED: canonical snapshot file empty; preserving committed statistics'
              exit 0
            fi
            python -m odds_scanner.research_v2_movement
            # Rebuild FT outcomes from the already-imported canonical results.
            # Preserve the previous verified population if the recalculation is incomplete.
            cp reports/research_v2_pattern_statistics.json /tmp/ft_previous_stats.json
            cp data/normalized/research_v2_pattern_outcomes.jsonl /tmp/ft_previous_outcomes.jsonl
            PYTHONPATH=src python -m odds_scanner.research_v2_pattern_stats > /tmp/ft_rebuild_result.json
            python - <<'PYFT'
            import json
            from pathlib import Path
            before=json.loads(Path('/tmp/ft_previous_stats.json').read_text())
            after=json.loads(Path('reports/research_v2_pattern_statistics.json').read_text())
            def ids(path):
                return {str(row['fixture_id']) for line in Path(path).read_text().splitlines() if (row:=json.loads(line)).get('fixture_id') is not None}
            old=ids('/tmp/ft_previous_outcomes.jsonl')
            new=ids('data/normalized/research_v2_pattern_outcomes.jsonl')
            if after.get('settled_fixtures',0)<before.get('settled_fixtures',0) or not old.issubset(new) or len(new)<len(old):
                raise SystemExit(f'BLOCKED FT rebuild: settled {before.get("settled_fixtures")} -> {after.get("settled_fixtures")}, lost IDs {len(old-new)}')
            print(f'FT rebuild verified: {before.get("settled_fixtures")} -> {after.get("settled_fixtures")}; missing {before.get("raw_unresolved_ft_fixtures")} -> {after.get("raw_unresolved_ft_fixtures")}')
            PYFT
            python -m odds_scanner.legacy_propline_recovery
            python -m odds_scanner.research_v2_evidence
            git add -f reports/scan_health_latest.json reports/scan_health_monitor.json reports/dashboard_scope.json reports/research_v2_end_to_end_audit.json reports/oddspapi_history_audit.json reports/research_v2_operational_audit.json reports/research_v2_movement_status.json reports/research_v2_fixture_identity.json data/normalized/research_v2_movement_features.jsonl
            git add -f reports/research_v2_pattern_statistics.json reports/research_v2_missing_ft_ledger.json data/normalized/research_v2_pattern_outcomes.jsonl
            git diff --cached --quiet && exit 0
            git commit -m 'data: rebuild Research V2 verified statistics [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
