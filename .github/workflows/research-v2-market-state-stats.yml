name: Research V2 Market State Stats
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'controls/research_v2_stats_rebuild_token.txt'
      - 'src/odds_scanner/research_v2_*.py'
      - 'src/odds_scanner/asian_settlement.py'
      - 'src/odds_scanner/legacy_propline_recovery.py'
      - 'data/normalized/*results*.jsonl'
      - '.github/workflows/research-v2-market-state-stats.yml'
permissions: {contents: write}
concurrency: {group: research-v2-derived, cancel-in-progress: false}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Rebuild and persist from latest canonical evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m odds_scanner.research_v2_movement
            python -m odds_scanner.research_v2_pattern_stats
            python -m odds_scanner.legacy_propline_recovery
            python -m odds_scanner.research_v2_operational_audit
            git add -f data/normalized reports
            git diff --cached --quiet && exit 0
            git commit -m 'data: rebuild Research V2 verified statistics [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
