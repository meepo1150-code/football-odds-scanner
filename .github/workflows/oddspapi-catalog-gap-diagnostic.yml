name: OddsPapi Catalog Gap Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['controls/oddspapi_catalog_gap_diagnostic_token.txt']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_oddspapi_catalog_gap_report.py
      - run: python -m odds_scanner.oddspapi_catalog_gap_report
      - name: Persist zero-quota diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/oddspapi_catalog_gap_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update OddsPapi catalog gap diagnostic [skip ci]'
          git push
# Uses only persisted repository files; no OddsPapi request is made.
# Diagnostic output cannot weaken mainLine requirements or alter frozen Validation v2.
