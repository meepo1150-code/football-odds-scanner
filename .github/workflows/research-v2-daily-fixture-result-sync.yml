name: Research V2 Daily Fixture Result Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
permissions:
  contents: write
concurrency:
  group: research-v2-daily-fixture-result-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Discover today's Football Day fixtures without requesting odds
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m odds_scanner.daily_fixture_result_sync
      - name: Backfill matured exact-ID results from prior observations
        run: python -m odds_scanner.v2_forward_result_backfill
      - name: Refresh settlement performance and readiness
        run: |
          python -m odds_scanner.v2_forward_performance
          python -m odds_scanner.v2_forward_readiness
      - name: Persist daily fixture and result evidence safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for path in \
            reports/research_v2_daily_sync_status.json \
            data/normalized/research_v2_daily_fixtures.jsonl \
            data/normalized/oddspapi_finished_results.jsonl \
            data/normalized/v2_forward_settlements.jsonl \
            reports/v2_forward_result_backfill.json \
            reports/v2_forward_performance.json \
            reports/v2_forward_readiness.json; do
            test -e "$path" && git add -f -- "$path"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'data: daily fixture and result sync [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

# 15:00 Asia/Bangkok daily data-completeness layer.
# Fixture discovery uses /fixtures only; it never requests odds.
# Result backfill is exact-ID only and makes zero OddsPAPI calls.
# Research metadata is not a betting recommendation, edge, CLV, or profit claim.
