name: Deploy Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/dashboard/**','reports/**','.github/workflows/pages.yml']
  workflow_run:
    workflows:
      - 'Live Odds Scan'
      - 'Current Multi-Market Provider Health'
      - 'Five Dollar Historical Snapshot Archive'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p site/reports/breadth
          cp apps/dashboard/index.html site/index.html
          for f in today.json pattern_registry.json current_provider_health.json provider_capabilities.json five_dollar_health.json five_dollar_archive_state.json five_dollar_research.json source_qualification.json; do
            test -f "reports/$f" && cp "reports/$f" "site/reports/$f" || true
          done
          test -f reports/breadth/summary.json && cp reports/breadth/summary.json site/reports/breadth/summary.json || true
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          text=p.read_text(encoding='utf-8')
          footer='<div style="max-width:1240px;margin:0 auto;padding:0 20px 28px;color:#91a1b8;font:12px system-ui">Football data by <a href="https://5dollarfootballapi.com" style="color:#8db8ff">5DollarFootballAPI</a>.</div>'
          if 'Football data by <a href="https://5dollarfootballapi.com"' not in text:
              text=text.replace('</body>', footer+'</body>')
              p.write_text(text,encoding='utf-8')
          PY
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
