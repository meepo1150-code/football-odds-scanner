name: Deploy Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'ah-public-demo.html'
      - 'reports/scan_health_latest.json'
      - 'reports/scan_health_monitor.json'
      - 'data/normalized/scan_health_history.jsonl'
      - 'reports/europe_pinnacle_research_v2_status.json'
      - 'src/odds_scanner/api_football_provider.py'
      - 'src/odds_scanner/dashboard_ft_refresh.py'
      - 'reports/propline_research_v2_status.json'
      - 'reports/oddspapi_quota_health.json'
      - 'reports/research_v2_pattern_statistics.json'
      - 'reports/pinnwire_result_join_status.json'
      - 'reports/pinnwire_research_v2_status.json'
      - 'data/normalized/europe_pinnacle_research_v2_snapshots.jsonl'
      - 'data/normalized/automatic_scan_slots.jsonl'
      - 'data/normalized/automatic_scan_manifests.jsonl'
      - 'reports/automatic_scan_latest.json'
      - 'data/normalized/europe_pinnacle_research_v2_audit.jsonl'
      - 'data/normalized/research_v2_slot_ledger.jsonl'
      - 'data/normalized/oddspapi_finished_results.jsonl'
      - 'data/normalized/oddspapi_finished_results.conflicts.jsonl'
      - 'data/normalized/dashboard_verified_results.jsonl'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Manual Current-Day Odds Observation'
      - 'Auto Scan'
      - 'Research V2 Offline Evidence Audit'
      - 'Research V2 Free Result Backfill'
      - 'Previous Day Results and Statistics'
      - 'Research V2 Market State Stats'
      - 'Research V2 Daily Fixture Result Sync'
      - 'Research V2 Results and Movement'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
# Finish the active publication; frequent report wakeups replace only pending work.
# Cancelling an in-flight Pages deployment can leave the published reports stale.
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'Manual Current-Day Odds Observation' || github.event.workflow_run.name == 'Auto Scan') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.event != 'pull_request_target' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: Build static site
        run: |
          set -euo pipefail
          python - <<'PYBUILD'
          import json, os, subprocess
          from pathlib import Path
          Path("apps/dashboard/deployment.json").write_text(json.dumps({"source_sha": subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), "run_id": os.environ["GITHUB_RUN_ID"]}))
          PYBUILD
          # Keep committed movement evidence unchanged during FT rollback.
          # Refresh FT coverage after scans. The builder preserves retained FT
          # outcomes and refuses to replace statistics from an empty snapshot cache.
          PYTHONPATH=src python -m odds_scanner.dashboard_ft_refresh
          # Preserve restored verified evidence during FT rollback.
          # Do not rebuild cross-report audit during FT rollback.
          PYTHONPATH=src python -m odds_scanner.oddspapi_history_audit > /dev/null
          PYTHONPATH=src python -m odds_scanner.dashboard_scope > /dev/null
          mkdir -p site/reports site/data/normalized site/discovery
          cp apps/dashboard/index.html site/index.html
          cp ah-public-demo.html site/ah-public-demo.html
          cp apps/dashboard/monitor.html site/monitor.html
          cp apps/dashboard/research-lab.html site/research-lab.html
          cp apps/dashboard/collection-health.js site/collection-health.js
          cp apps/dashboard/deployment.json site/deployment.json
          test -f apps/dashboard/discovery.html && cp apps/dashboard/discovery.html site/discovery.html || true
          test -f apps/dashboard/discovery.html && cp apps/dashboard/discovery.html site/discovery/index.html || true
          test -f apps/dashboard/404.html && cp apps/dashboard/404.html site/404.html || true
          for f in automatic_scan_latest.json scan_health_latest.json scan_health_monitor.json daily_preparation_status.json pinnwire_web_result_recovery_queue.json dashboard_scope.json research_v2_end_to_end_audit.json oddspapi_history_audit.json oddspapi_result_join.json oddspapi_settled_history.json research_v2_operational_audit.json legacy_propline_recovery.json research_v2_daily_sync_status.json research_v2_movement_status.json propline_research_v2_status.json europe_pinnacle_research_v2_status.json oddspapi_quota_health.json research_v2_pattern_statistics.json pinnwire_result_join_status.json pinnwire_research_v2_status.json; do
            test -f "reports/$f" && cp "reports/$f" "site/reports/$f" || true
          done
          test -f reports/research_v2_missing_ft_ledger.json && cp reports/research_v2_missing_ft_ledger.json site/reports/research_v2_missing_ft_ledger.json
          for f in automatic_scan_slots.jsonl automatic_scan_manifests.jsonl scan_health_history.jsonl europe_pinnacle_research_v2_snapshots.jsonl europe_pinnacle_research_v2_audit.jsonl research_v2_slot_ledger.jsonl oddspapi_finished_results.conflicts.jsonl oddspapi_finished_results.jsonl dashboard_verified_results.jsonl; do
            test -f "data/normalized/$f" && cp "data/normalized/$f" "site/data/normalized/$f" || true
          done
      - uses: actions/configure-pages@v6
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live Pages matches this build and published research data
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PYVERIFY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = os.environ['DEPLOY_URL'].rstrip('/') + '/'
          run_id = os.environ['DEPLOY_RUN_ID']
          local_deploy = json.loads(Path('site/deployment.json').read_text())
          expected_sha = local_deploy['source_sha']
          # GitHub Pages CDN propagation is asynchronous after deploy-pages
          # reports success. Verify actual files before marking green.
          def read_live(name):
              url = base + name + '?publication_verify=' + run_id
              request = urllib.request.Request(
                  url, headers={'Cache-Control': 'no-cache',
                                'User-Agent': 'football-odds-scanner-publication-check'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{name}: HTTP {response.status}')
                  return response.read()

          def verify():
              deployed = json.loads(read_live('deployment.json'))
              if deployed.get('source_sha') != expected_sha:
                  raise RuntimeError(
                      f"Stale Pages deployment: expected {expected_sha}, "
                      f"received {deployed.get('source_sha')}")
              if Path('site/reports/research_v2_pattern_statistics.json').exists():
                  expected = json.loads(Path('site/reports/research_v2_pattern_statistics.json').read_text())
                  current = json.loads(read_live('reports/research_v2_pattern_statistics.json'))
                  for key in ('raw_snapshot_rows', 'snapshot_rows', 'settled_fixtures',
                              'ft_completeness_denominator', 'raw_unresolved_ft_fixtures'):
                      if current.get(key) != expected.get(key):
                          raise RuntimeError(
                              f'Stale published statistics {key}: '
                              f"expected {expected.get(key)}, received {current.get(key)}")
                  ledger = json.loads(read_live('reports/research_v2_missing_ft_ledger.json'))
                  if ledger['missing_ft_count'] != current['raw_unresolved_ft_fixtures']:
                      raise RuntimeError('Published FT ledger and statistics disagree')
              if Path('site/reports/automatic_scan_latest.json').exists():
                  expected = json.loads(Path('site/reports/automatic_scan_latest.json').read_text())
                  current = json.loads(read_live('reports/automatic_scan_latest.json'))
                  for key in ('slot_id', 'status', 'scan_health', 'generated_at'):
                      if current.get(key) != expected.get(key):
                          raise RuntimeError(f'Stale published automatic scan receipt: {key}')
              # Compare the actual published JSONL bytes, not merely HTTP 200:
              # a stale Pages bundle may return 200 for an older slot history.
              for name in ('automatic_scan_slots.jsonl',
                           'automatic_scan_manifests.jsonl'):
                  path = Path('site/data/normalized') / name
                  if path.exists():
                      current = read_live('data/normalized/' + name)
                      if current != path.read_bytes():
                          raise RuntimeError('Stale published automatic scan data: ' + name)
              return deployed

          for attempt in range(1, 25):
              try:
                  deployed = verify()
                  print('LIVE_DASHBOARD_VERIFIED', json.dumps({
                      'source_sha': expected_sha,
                      'run_id': run_id,
                      'pages_url': base,
                      'statistics_and_scan_receipts': 'MATCH_LOCAL_BUILD'
                  }))
                  break
              except (urllib.error.URLError, TimeoutError, ValueError,
                      KeyError, json.JSONDecodeError, RuntimeError) as exc:
                  if attempt == 24:
                      raise SystemExit(f'LIVE_DASHBOARD_VERIFICATION_FAILED: {exc}')
                  print(f'Pages propagation check {attempt}/24: {exc}; retry in 5s')
                  time.sleep(5)
          PYVERIFY
