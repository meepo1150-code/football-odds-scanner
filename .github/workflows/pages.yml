name: Deploy Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/dashboard/**','reports/**','.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p site/reports/breadth
          cp apps/dashboard/index.html site/index.html
          for f in today.json pattern_registry.json current_provider_health.json provider_capabilities.json; do
            test -f "reports/$f" && cp "reports/$f" "site/reports/$f" || true
          done
          test -f reports/breadth/summary.json && cp reports/breadth/summary.json site/reports/breadth/summary.json || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
