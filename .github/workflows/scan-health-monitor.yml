name: Retired - scan-health-monitor.yml
# Scanner operational monitoring retired; historical reports are preserved.
on:
  workflow_dispatch:
    inputs:
      retired:
        description: 'Old scanner monitoring disabled'
        type: boolean
        default: false
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Legacy scan monitor retired'
