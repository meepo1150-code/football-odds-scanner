name: Research V2 Scheduled Slot Recovery
on:
  workflow_dispatch:
  schedule:
    # Independent trigger, sharing the collector lock and local attempt gate.
    # If the primary schedule ran, this makes zero provider requests.
    - cron: '17,37,57 14 * * 1-5'\n    - cron: '17,47 11 * * 1-5'
    - cron: '17,47 5,8,11,12,13,14,15 * * 0,6'
  push:
    branches: [main]
    paths: ['.github/workflows/research-v2-scheduled-slot-recovery.yml', 'controls/research_v2_recovery_token.txt']
permissions: {contents: write}
concurrency: {group: research-v2-collectors, cancel-in-progress: false}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: Check whether this scheduled slot still needs an attempt
        id: due
        env:
          SCAN_EVENT: ${{ github.event_name }}
          PYTHONPATH: src
        run: python -m odds_scanner.research_v2_scan_due >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.due.outputs.collect == 'true'
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
        if: steps.due.outputs.collect == 'true'
      - name: Collect PinnWire Research V2
        if: steps.due.outputs.collect == 'true'
        env:
          PINNWIRE_V2_SCAN: 'true'
        run: python -m odds_scanner.pinnwire_probe
      - name: Recover with PropLine when PinnWire is unavailable
        if: steps.due.outputs.collect == 'true'
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          python - <<'PY'
          import json,subprocess
          r=json.load(open('reports/pinnwire_research_v2_status.json',encoding='utf-8'))
          if r.get('status') not in {'RESEARCH_V2_OBSERVED','ZERO_FIXTURES'}:
              subprocess.run(['python','-m','odds_scanner.propline_research_v2'],check=True)
          PY
      - name: Rebuild movement and statistics from latest snapshots
        if: steps.due.outputs.collect == 'true'
        run: |
          python -m odds_scanner.research_v2_movement
          python -m odds_scanner.research_v2_pattern_stats
      - name: Persist raw evidence and rebuild against latest main
        if: steps.due.outputs.collect == 'true'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          stage=$(mktemp -d)
          paths=(data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl data/normalized/research_v2_slot_ledger.jsonl reports/pinnwire_research_v2_status.json reports/propline_research_v2_status.json reports/europe_pinnacle_research_v2_status.json)
          for f in "${paths[@]}"; do if test -f "$f"; then mkdir -p "$stage/$(dirname "$f")"; cp "$f" "$stage/$f"; fi; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m odds_scanner.research_v2_persistence "$stage"
            python -m odds_scanner.research_v2_movement
            python -m odds_scanner.research_v2_pattern_stats
            python -m odds_scanner.legacy_propline_recovery
            python -m odds_scanner.research_v2_operational_audit
            git add -f data/normalized reports
            git diff --cached --quiet && exit 0
            git commit -m 'data: merge Research V2 evidence and rebuild [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          echo 'Failed to persist Research V2 output' >&2
          exit 1
