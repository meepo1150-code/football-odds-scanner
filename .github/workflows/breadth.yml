name: Big-5 Data Breadth Research
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/odds_scanner/breadth_data.py'
      - 'src/odds_scanner/breadth_pipeline.py'
      - 'src/odds_scanner/hierarchical_backtest.py'
      - 'src/odds_scanner/robust_stats.py'
      - 'src/odds_scanner/asian_settlement.py'
      - 'src/odds_scanner/settlement_ev.py'
      - 'src/odds_scanner/pattern_policy.py'
      - 'src/odds_scanner/three_way_audit.py'
      - 'src/odds_scanner/pattern_registry.py'
      - 'src/odds_scanner/scanner.py'
      - 'tests/test_breadth_data.py'
      - 'tests/test_three_way_audit.py'
      - 'tests/test_robust_stats.py'
      - 'tests/test_pattern_registry.py'
      - 'tests/test_current_ev_scanner.py'
      - 'tests/test_asian_settlement.py'
      - '.github/workflows/breadth.yml'
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/breadth_data.py'
      - 'src/odds_scanner/breadth_pipeline.py'
      - 'src/odds_scanner/hierarchical_backtest.py'
      - 'src/odds_scanner/robust_stats.py'
      - 'src/odds_scanner/asian_settlement.py'
      - 'src/odds_scanner/settlement_ev.py'
      - 'src/odds_scanner/pattern_policy.py'
      - 'src/odds_scanner/three_way_audit.py'
      - 'src/odds_scanner/pattern_registry.py'
      - 'src/odds_scanner/scanner.py'
      - '.github/workflows/breadth.yml'
  schedule:
    - cron: '30 3 * * 6'
concurrency:
  group: odds-scanner-output-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Run Big-5 breadth integration
        if: github.event_name != 'pull_request'
        run: python -m odds_scanner.breadth_pipeline
      - name: Commit owned breadth outputs without generated-file rebase conflicts
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rm -rf /tmp/breadth-owned
          mkdir -p /tmp/breadth-owned/data/normalized /tmp/breadth-owned/reports
          cp data/normalized/big5_multimarket_history.csv /tmp/breadth-owned/data/normalized/
          cp -R reports/breadth /tmp/breadth-owned/reports/
          cp reports/pattern_registry.json /tmp/breadth-owned/reports/
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/normalized reports
            rm -rf reports/breadth
            cp /tmp/breadth-owned/data/normalized/big5_multimarket_history.csv data/normalized/
            cp -R /tmp/breadth-owned/reports/breadth reports/
            cp /tmp/breadth-owned/reports/pattern_registry.json reports/
            git add -- data/normalized/big5_multimarket_history.csv reports/breadth/ reports/pattern_registry.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update Big-5 breadth research outputs'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying from latest main"
          done
          exit 1
