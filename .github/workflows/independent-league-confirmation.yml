name: Independent League Confirmation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/independent_league_confirmation.py'
      - 'tests/test_independent_league_confirmation.py'
      - 'reports/independent_league_preregistration.json'
      - '.github/workflows/independent-league-confirmation.yml'
  workflow_dispatch:
concurrency:
  group: odds-scanner-output-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - name: Checkout frozen mirror
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: huhao930422-debug/football-odds-mirror
          ref: c9b05a30eef50fe34abbf4134e6333fc5376d136
          path: external/football-odds-mirror
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Verify frozen preregistration
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/independent_league_preregistration.json', encoding='utf-8'))
          assert p['locked_before_independent_holdout_evaluation'] is True
          assert p['source']['mirror_commit']=='c9b05a30eef50fe34abbf4134e6333fc5376d136'
          assert p['split']['holdout']==['2526']
          assert len(p['independent_league_universe'])==5
          print('INDEPENDENT_PREREGISTRATION_LOCKED')
          PY
          cp reports/pattern_registry.json /tmp/production_pattern_registry.json
      - name: Run independent holdout confirmation
        if: github.event_name != 'pull_request'
        run: python -m odds_scanner.independent_league_confirmation --mirror-root external/football-odds-mirror
      - name: Prove production registry unchanged
        if: github.event_name != 'pull_request'
        run: |
          cmp -s reports/pattern_registry.json /tmp/production_pattern_registry.json
          python - <<'PY'
          import json
          c=json.load(open('reports/independent_league_pattern_registry_candidate.json', encoding='utf-8'))
          p=json.load(open('reports/pattern_registry.json', encoding='utf-8'))
          print({'candidate_patterns': c.get('pattern_count'), 'production_patterns': p.get('pattern_count')})
          PY
      - name: Persist independent evidence safely
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          artifacts=(
            reports/independent_league_preregistration.json
            reports/independent_league_validation.json
            reports/independent_league_pattern_registry_candidate.json
          )
          tar -cf /tmp/independent-evidence.tar "${artifacts[@]}"
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/independent-evidence.tar
            git add -f "${artifacts[@]}"
            git diff --cached --quiet && exit 0
            git commit -m 'Persist independent league confirmation [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
