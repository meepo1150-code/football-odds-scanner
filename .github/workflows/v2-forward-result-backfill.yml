name: Validation v2 Forward Result Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/v2_forward_result_backfill.py'
      - 'src/odds_scanner/flashscore_result_provider.py'
      - 'src/odds_scanner/oddspapi_result_cache.py'
      - 'tests/test_v2_forward_result_backfill.py'
      - '.github/workflows/v2-forward-result-backfill.yml'
  schedule:
    - cron: '27 2,8,14,20 * * *'
permissions:
  contents: write
concurrency:
  group: validation-v2-forward-result-backfill
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify exact-ID forward result contracts
        run: pytest -q tests/test_v2_mainline_observer_runner.py tests/test_v2_forward_entries.py tests/test_v2_forward_result_backfill.py tests/test_v2_forward_performance.py tests/test_v2_forward_readiness.py
      - name: Backfill matured exact-ID forward fixtures
        run: python -m odds_scanner.v2_forward_result_backfill
      - name: Refresh settlement performance and frozen readiness
        run: |
          python -m odds_scanner.v2_forward_performance
          python -m odds_scanner.v2_forward_readiness
      - name: Persist exact forward result evidence safely
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-forward-results
          for spec in \
            'data/normalized/oddspapi_finished_results.jsonl results.jsonl' \
            'data/normalized/oddspapi_finished_results.conflicts.jsonl conflicts.jsonl' \
            'data/normalized/v2_forward_settlements.jsonl settlements.jsonl' \
            'reports/v2_forward_result_backfill.json backfill.json' \
            'reports/v2_forward_performance.json performance.json' \
            'reports/v2_forward_readiness.json readiness.json'; do
            set -- $spec
            [ -f "$1" ] && cp "$1" "/tmp/v2-forward-results/$2"
          done
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            # Merge the fetched exact results into the latest cache rather than
            # replacing results another workflow wrote during this request.
            python -c 'import json; from pathlib import Path; p=Path("data/normalized/oddspapi_finished_results.conflicts.jsonl"); q=Path("/tmp/v2-forward-results/conflicts.jsonl"); rows=[json.loads(x) for f in (p,q) if f.exists() for x in f.read_text().splitlines() if x.strip()]; p.write_text("".join(x+"\n" for x in sorted({json.dumps(r,sort_keys=True) for r in rows}))) if rows else None'
            python -c 'import json; from pathlib import Path; from odds_scanner.oddspapi_result_cache import merge_normalized_results; p=Path("/tmp/v2-forward-results/results.jsonl"); merge_normalized_results(Path("data/normalized/oddspapi_finished_results.jsonl"), [json.loads(x) for x in p.read_text().splitlines() if x.strip()] if p.exists() else [])'
            [ -f /tmp/v2-forward-results/backfill.json ] && cp /tmp/v2-forward-results/backfill.json reports/v2_forward_result_backfill.json
            python -m odds_scanner.v2_forward_clv
            python -m odds_scanner.v2_forward_performance
            python -m odds_scanner.v2_forward_readiness
            for path in \
              data/normalized/oddspapi_finished_results.jsonl \
              data/normalized/oddspapi_finished_results.conflicts.jsonl \
              data/normalized/v2_forward_settlements.jsonl \
              reports/v2_forward_result_backfill.json \
              reports/v2_forward_clv_status.json \
              reports/v2_forward_performance.json \
              reports/v2_forward_readiness.json; do
              [ -f "$path" ] && git add -f -- "$path"
            done
            git diff --cached --quiet && exit 0
            git commit -m '[skip ci] Update validation v2 exact forward results'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
          done
          exit 1

# This workflow makes zero OddsPapi calls. It only requests an exact Flashscore
# event page when an immutable forward entry already carries an OddsPapi-supplied
# flashscoreId and kickoff is at least 3 hours old. Team/date fuzzy discovery is
# prohibited. Results merge into the shared exact fixture-id cache, then the
# frozen settlement/performance/readiness layers refresh automatically.
