name: Flashscore Exact-ID Connectivity Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/flashscore_exact_probe.py'
      - 'tests/test_flashscore_exact_probe.py'
      - '.github/workflows/flashscore-exact-id-probe.yml'
permissions: {contents: write}
concurrency: {group: flashscore-exact-id-probe, cancel-in-progress: false}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_flashscore_exact_probe.py
      - name: Probe exact Flashscore event page reachability
        run: python -m odds_scanner.flashscore_exact_probe
      - name: Commit connectivity report
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/flashscore_exact_id_probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Flashscore exact-ID connectivity probe [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

# Research-only reachability probe. No fuzzy team-name matching and no
# production/promotion effect. Remove or keep manual-only if the provider blocks runners.
