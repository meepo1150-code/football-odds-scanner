name: Research V2 Offline Evidence Audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['src/odds_scanner/**', 'apps/dashboard/**', '.github/workflows/research-v2-offline-evidence.yml', 'controls/research_v2_offline_audit_token.txt']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: research-v2-offline-evidence, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Rebuild without provider calls or raw changes
        run: |
          python -m odds_scanner.research_v2_movement > /dev/null
          python -m odds_scanner.research_v2_pattern_stats > /dev/null
          python -m odds_scanner.research_v2_evidence > /dev/null
          python -m odds_scanner.research_v2_end_to_end_audit > /dev/null
          python -m odds_scanner.dashboard_scope > /dev/null
          python -m odds_scanner.oddspapi_history_audit > /dev/null
          git diff --exit-code -- data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl data/normalized/oddspapi_finished_results.jsonl data/normalized/oddspapi_history_ticks.jsonl reports/pattern_registry.json
      - name: Persist current derived evidence on main only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m odds_scanner.research_v2_movement > /dev/null
            python -m odds_scanner.research_v2_pattern_stats > /dev/null
            python -m odds_scanner.research_v2_evidence > /dev/null
            git add -f reports/dashboard_scope.json reports/research_v2_end_to_end_audit.json reports/oddspapi_history_audit.json reports/research_v2_pattern_statistics.json reports/research_v2_operational_audit.json reports/research_v2_movement_status.json reports/research_v2_missing_ft_ledger.json reports/research_v2_fixture_identity.json data/normalized/research_v2_pattern_outcomes.jsonl data/normalized/research_v2_movement_features.jsonl
            python -m odds_scanner.research_v2_end_to_end_audit > /dev/null
            python -m odds_scanner.dashboard_scope > /dev/null
            python -m odds_scanner.oddspapi_history_audit > /dev/null
            git add -f data/normalized/research_v2_movement_features.jsonl data/normalized/research_v2_pattern_outcomes.jsonl reports/research_v2_movement_status.json reports/research_v2_pattern_statistics.json reports/research_v2_operational_audit.json reports/research_v2_end_to_end_audit.json reports/research_v2_missing_ft_ledger.json reports/research_v2_fixture_identity.json reports/dashboard_scope.json reports/oddspapi_history_audit.json
            git diff --cached --quiet && exit 0
            git commit -m 'data: regenerate offline research evidence [skip ci]'
            git push origin HEAD:main && exit 0
          done
          exit 1
