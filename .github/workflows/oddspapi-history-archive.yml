name: OddsPapi Historical Tick Archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/oddspapi_history_archive.py'
      - 'src/odds_scanner/oddspapi_history_archive_sharded.py'
      - 'src/odds_scanner/oddspapi_history_store.py'
      - 'src/odds_scanner/oddspapi_history_runner.py'
      - 'src/odds_scanner/oddspapi_fixture_refs.py'
      - 'src/odds_scanner/oddspapi_result_cache.py'
      - 'src/odds_scanner/oddspapi_result_join.py'
      - 'src/odds_scanner/settled_history.py'
      - 'src/odds_scanner/asian_settlement.py'
      - 'tests/test_oddspapi_history_archive.py'
      - 'tests/test_oddspapi_history_store.py'
      - 'tests/test_oddspapi_history_runner.py'
      - 'tests/test_oddspapi_fixture_refs.py'
      - 'tests/test_oddspapi_result_cache.py'
      - 'tests/test_oddspapi_result_join.py'
      - 'tests/test_settled_history.py'
      - 'tests/test_asian_settlement.py'
      - '.github/workflows/oddspapi-history-archive.yml'
  schedule:
    - cron: '25 * * * *'
permissions: {contents: write}
concurrency: {group: oddspapi-history-archive, cancel-in-progress: false}
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}'}
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Archive up to 10 finished Big-5 historical fixtures
        run: python -m odds_scanner.oddspapi_history_runner
      - name: Build exact result join and settlement research rows
        run: |
          python -c "from odds_scanner.oddspapi_result_join import write_join; print(write_join())"
          python -c "from odds_scanner.settled_history import write_settled; print(write_settled())"
      - name: Commit historical research artifacts safely
        run: |
          set -euo pipefail
          mkdir -p /tmp/oddspapi-history
          cp reports/oddspapi_history_state.json /tmp/oddspapi-history/state.json
          for spec in \
            'data/normalized/oddspapi_market_catalog.json catalog.json' \
            'data/normalized/oddspapi_fixture_refs.jsonl refs.jsonl' \
            'data/normalized/oddspapi_finished_results.jsonl results.jsonl' \
            'data/normalized/oddspapi_prematch_joined.jsonl joined.jsonl' \
            'data/normalized/oddspapi_settled_history.jsonl settled.jsonl' \
            'reports/oddspapi_result_join.json join-report.json' \
            'reports/oddspapi_settled_history.json settled-report.json'; do
            set -- $spec; [ -f "$1" ] && cp "$1" "/tmp/oddspapi-history/$2"
          done
          if [ -d data/normalized/oddspapi_history_ticks ]; then
            mkdir -p /tmp/oddspapi-history/tick-shards
            cp -a data/normalized/oddspapi_history_ticks/. /tmp/oddspapi-history/tick-shards/
          fi
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            mkdir -p reports data/normalized
            cp /tmp/oddspapi-history/state.json reports/oddspapi_history_state.json
            declare -A MAP=(
              [catalog.json]=data/normalized/oddspapi_market_catalog.json
              [refs.jsonl]=data/normalized/oddspapi_fixture_refs.jsonl
              [results.jsonl]=data/normalized/oddspapi_finished_results.jsonl
              [joined.jsonl]=data/normalized/oddspapi_prematch_joined.jsonl
              [settled.jsonl]=data/normalized/oddspapi_settled_history.jsonl
              [join-report.json]=reports/oddspapi_result_join.json
              [settled-report.json]=reports/oddspapi_settled_history.json)
            for src in "${!MAP[@]}"; do
              [ -f "/tmp/oddspapi-history/$src" ] && cp "/tmp/oddspapi-history/$src" "${MAP[$src]}"
            done
            if [ -d /tmp/oddspapi-history/tick-shards ]; then
              mkdir -p data/normalized/oddspapi_history_ticks
              cp -a /tmp/oddspapi-history/tick-shards/. data/normalized/oddspapi_history_ticks/
            fi
            for path in \
              reports/oddspapi_history_state.json \
              data/normalized/oddspapi_market_catalog.json \
              data/normalized/oddspapi_fixture_refs.jsonl \
              data/normalized/oddspapi_finished_results.jsonl \
              data/normalized/oddspapi_prematch_joined.jsonl \
              data/normalized/oddspapi_settled_history.jsonl \
              reports/oddspapi_result_join.json \
              reports/oddspapi_settled_history.json; do
              [ -f "$path" ] && git add -f -- "$path"
            done
            if [ -d data/normalized/oddspapi_history_ticks ]; then
              git add -f -- data/normalized/oddspapi_history_ticks/*.jsonl
            fi
            git diff --cached --quiet && exit 0
            git commit -m 'Update OddsPapi historical research artifacts [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

# The legacy 51MB monolithic history file is intentionally read-only.
# New ticks are persisted as UTC-day shards to avoid GitHub file-size growth.
# Settlement outputs remain exploratory and promotion-disabled until a
# preregistered multi-season chronological validation passes.
# Manual discovery advance marker: 2026-09-09T14:21Z
