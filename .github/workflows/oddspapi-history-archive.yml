name: OddsPapi Historical Tick Archive
on:
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *'
permissions:
  contents: write
concurrency:
  group: oddspapi-history-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Archive up to 10 finished Big-5 historical fixtures
        run: python -m odds_scanner.oddspapi_history_archive
      - name: Commit historical archive safely
        run: |
          set -euo pipefail
          mkdir -p /tmp/oddspapi-history
          cp reports/oddspapi_history_state.json /tmp/oddspapi-history/state.json
          if [ -f data/normalized/oddspapi_history_ticks.jsonl ]; then
            cp data/normalized/oddspapi_history_ticks.jsonl /tmp/oddspapi-history/history.jsonl
          fi
          if [ -f data/normalized/oddspapi_market_catalog.json ]; then
            cp data/normalized/oddspapi_market_catalog.json /tmp/oddspapi-history/catalog.json
          fi
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            cp /tmp/oddspapi-history/state.json reports/oddspapi_history_state.json
            [ ! -f /tmp/oddspapi-history/history.jsonl ] || cp /tmp/oddspapi-history/history.jsonl data/normalized/oddspapi_history_ticks.jsonl
            [ ! -f /tmp/oddspapi-history/catalog.json ] || cp /tmp/oddspapi-history/catalog.json data/normalized/oddspapi_market_catalog.json
            git add -- reports/oddspapi_history_state.json data/normalized/oddspapi_history_ticks.jsonl data/normalized/oddspapi_market_catalog.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -m 'Update OddsPapi historical tick archive [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
          done
          exit 1

# Historical-odds calls are unmetered by OddsPapi but paced at 5.2s. Finished
# fixture discovery is cached and refreshed weekly; ordinary hourly drain runs
# therefore consume zero billable requests until the queue needs refreshing.
