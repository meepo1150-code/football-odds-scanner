name: OddsPapi Historical Tick Archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/oddspapi_history_archive.py'
      - 'src/odds_scanner/oddspapi_history_runner.py'
      - 'src/odds_scanner/oddspapi_result_cache.py'
      - 'src/odds_scanner/oddspapi_result_join.py'
      - 'tests/test_oddspapi_history_archive.py'
      - 'tests/test_oddspapi_history_runner.py'
      - 'tests/test_oddspapi_result_cache.py'
      - 'tests/test_oddspapi_result_join.py'
      - '.github/workflows/oddspapi-history-archive.yml'
  schedule:
    - cron: '25 * * * *'
permissions:
  contents: write
concurrency:
  group: oddspapi-history-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Archive up to 10 finished Big-5 historical fixtures
        run: python -m odds_scanner.oddspapi_history_runner
      - name: Build exact fixture-id result join
        run: python -c "from odds_scanner.oddspapi_result_join import write_join; print(write_join())"
      - name: Commit historical archive safely
        run: |
          set -euo pipefail
          mkdir -p /tmp/oddspapi-history
          cp reports/oddspapi_history_state.json /tmp/oddspapi-history/state.json
          for spec in \
            'data/normalized/oddspapi_history_ticks.jsonl history.jsonl' \
            'data/normalized/oddspapi_market_catalog.json catalog.json' \
            'data/normalized/oddspapi_finished_results.jsonl results.jsonl' \
            'data/normalized/oddspapi_prematch_joined.jsonl joined.jsonl' \
            'reports/oddspapi_result_join.json join-report.json'; do
            set -- $spec; [ -f "$1" ] && cp "$1" "/tmp/oddspapi-history/$2"
          done
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            cp /tmp/oddspapi-history/state.json reports/oddspapi_history_state.json
            git add -f -- reports/oddspapi_history_state.json
            [ -f /tmp/oddspapi-history/history.jsonl ] && cp /tmp/oddspapi-history/history.jsonl data/normalized/oddspapi_history_ticks.jsonl
            [ -f /tmp/oddspapi-history/catalog.json ] && cp /tmp/oddspapi-history/catalog.json data/normalized/oddspapi_market_catalog.json
            [ -f /tmp/oddspapi-history/results.jsonl ] && cp /tmp/oddspapi-history/results.jsonl data/normalized/oddspapi_finished_results.jsonl
            [ -f /tmp/oddspapi-history/joined.jsonl ] && cp /tmp/oddspapi-history/joined.jsonl data/normalized/oddspapi_prematch_joined.jsonl
            [ -f /tmp/oddspapi-history/join-report.json ] && cp /tmp/oddspapi-history/join-report.json reports/oddspapi_result_join.json
            git add -f -- data/normalized/oddspapi_history_ticks.jsonl data/normalized/oddspapi_market_catalog.json data/normalized/oddspapi_finished_results.jsonl data/normalized/oddspapi_prematch_joined.jsonl reports/oddspapi_result_join.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -m 'Update OddsPapi historical archive and result join [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
          done
          exit 1

# Historical-odds calls remain paced and result harvesting adds no provider call:
# explicit FT scores are cached from the same finished-fixture discovery payload.
# Joined rows remain research-only and promotion-disabled until multi-season validation.
