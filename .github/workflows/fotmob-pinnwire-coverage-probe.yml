name: FotMob PinnWire Coverage Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'controls/fotmob_coverage_probe_token.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Probe exact FotMob coverage
        run: python -m odds_scanner.fotmob_coverage_probe
      - name: Persist diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp reports/fotmob_pinnwire_coverage_probe.json /tmp/fotmob_probe.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/fotmob_probe.json reports/fotmob_pinnwire_coverage_probe.json
          git add -f reports/fotmob_pinnwire_coverage_probe.json
          git diff --cached --quiet || (git commit -m 'diag: update FotMob PinnWire coverage probe [skip ci]' && git push origin HEAD:main)
