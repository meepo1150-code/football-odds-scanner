name: Europe Pinnacle Research V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'controls/europe_pinnacle_research_v2_run_token.txt'
  schedule:
    # Primary observations plus one-hour fallback slots. The collector's
    # schedule-lag guard decides whether a run is eligible before any API call.
    - cron: '0 14,15 * * 1-5'
    - cron: '0 17,18 * * 1-5'
    - cron: '0 5,6 * * 6,0'
    - cron: '0 8,9 * * 6,0'
    - cron: '0 11,12 * * 6,0'
    - cron: '0 13,14 * * 6,0'
permissions:
  contents: write
concurrency:
  group: europe-pinnacle-research-v2
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Collect football-day research population
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m odds_scanner.europe_pinnacle_discovery
      - name: Build current movement features
        run: python -m odds_scanner.research_v2_movement
      - name: Persist research v2 evidence safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in \
            reports/europe_pinnacle_research_v2_status.json \
            reports/research_v2_movement_status.json \
            data/normalized/europe_pinnacle_research_v2_snapshots.jsonl \
            data/normalized/europe_pinnacle_research_v2_audit.jsonl \
            data/normalized/research_v2_movement_features.jsonl; do
            test -e "$f" && git add -f -- "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'data: update Pinnacle research v2 [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
# Research only. MATCH/NOT_MATCH and movement are metadata, never a betting recommendation, edge, CLV, or profit claim.
