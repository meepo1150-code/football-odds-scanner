name: Europe Pinnacle Research V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['controls/europe_pinnacle_research_v2_run_token.txt']
  schedule:
    # Heartbeats around canonical observation slots. Python owns slot eligibility
    # and idempotency, so delayed/duplicate GitHub cron wakes do not duplicate API scans.
    - cron: '0,30 14,15 * * 1-5'
    - cron: '0,30 17,18 * * 1-5'
    - cron: '0,30 5,6,8,9,11,12,13,14 * * 6,0'
permissions: {contents: write}
concurrency:
  group: europe-pinnacle-research-v2
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Collect canonical-slot football-day research population
        env: {ODDSPAPI_KEY: '${{ secrets.ODDSPAPI_KEY }}'}
        run: python -m odds_scanner.europe_pinnacle_discovery
      - name: Build current movement features
        run: python -m odds_scanner.research_v2_movement
      - name: Persist research v2 evidence safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          paths=(reports/europe_pinnacle_research_v2_status.json reports/research_v2_movement_status.json data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl data/normalized/research_v2_movement_features.jsonl)
          rm -rf /tmp/research-v2 && mkdir -p /tmp/research-v2
          for f in "${paths[@]}"; do if test -e "$f"; then mkdir -p "/tmp/research-v2/$(dirname "$f")"; cp "$f" "/tmp/research-v2/$f"; fi; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in "${paths[@]}"; do if test -e "/tmp/research-v2/$f"; then mkdir -p "$(dirname "$f")"; cp "/tmp/research-v2/$f" "$f"; git add -f -- "$f"; fi; done
            git diff --cached --quiet && exit 0
            git commit -m 'data: update Pinnacle research v2 [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
# Canonical slots remain 21:00/00:00 weekdays and 12:00/15:00/18:00/20:00 weekends Bangkok.
# Recovery window is 105 minutes; scheduled_target_at is canonical and actual_observed_at is real collection time.
# Duplicate heartbeats skip before OddsPAPI calls once that canonical slot is present in audit data.
# MATCH/NOT_MATCH and movement are research metadata, never a betting recommendation, edge, CLV, or profit claim.
