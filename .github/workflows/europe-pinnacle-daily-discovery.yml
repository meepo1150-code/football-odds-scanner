name: Europe Pinnacle Research V2
on:
  workflow_dispatch:
  schedule:
    # Bangkok football-day research schedule.
    # Mon-Fri: 21:00 and 00:00 Bangkok (00:00 belongs to previous football day).
    - cron: '0 14 * * 1-5'
    - cron: '0 17 * * 1-5'
    # Sat-Sun: 12:00, 15:00, 18:00, 20:00 Bangkok.
    - cron: '0 5 * * 6,0'
    - cron: '0 8 * * 6,0'
    - cron: '0 11 * * 6,0'
    - cron: '0 13 * * 6,0'
permissions:
  contents: write
concurrency:
  group: europe-pinnacle-research-v2
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Collect football-day research population
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m odds_scanner.europe_pinnacle_discovery
      - name: Persist research v2 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/europe_pinnacle_research_v2_status.json data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'data: update Pinnacle research v2 [skip ci]'
          git push
# Research only: all fixtures in the selected leagues and Bangkok football-day window are retained.
# MATCH/NOT_MATCH is a feature for later analysis, never a betting recommendation.
