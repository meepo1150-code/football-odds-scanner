name: Flashscore Exact Result Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/flashscore_result_provider.py'
      - 'src/odds_scanner/oddspapi_result_join.py'
      - 'data/normalized/oddspapi_fixture_refs.jsonl'
      - '.github/workflows/flashscore-result-backfill.yml'

permissions:
  contents: write

concurrency:
  group: flashscore-result-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Backfill exact Flashscore results
        run: python -m odds_scanner.flashscore_result_provider
      - name: Rebuild strict prematch join and settlement
        run: |
          python - <<'PY'
          from odds_scanner.oddspapi_result_join import write_join
          from odds_scanner.settled_history import write_settled
          print(write_join())
          print(write_settled())
          PY
      - name: Commit result artifacts without generated-file rebase conflicts
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          artifacts=(
            data/normalized/oddspapi_finished_results.jsonl
            data/normalized/oddspapi_prematch_joined.jsonl
            data/normalized/oddspapi_settled_history.jsonl
            reports/flashscore_result_backfill.json
            reports/oddspapi_result_join.json
            reports/oddspapi_settled_history.json
          )
          existing=()
          for p in "${artifacts[@]}"; do
            [ -e "$p" ] && existing+=("$p")
          done
          [ "${#existing[@]}" -eq 0 ] && exit 0
          tar -cf /tmp/result-artifacts.tar "${existing[@]}"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/result-artifacts.tar
            for p in "${existing[@]}"; do
              [ -e "$p" ] && git add -f "$p"
            done
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Update exact result backfill [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main on attempt $attempt; retrying from latest origin/main"
          done
          echo 'Could not persist result artifacts after 3 race-safe attempts' >&2
          exit 1

