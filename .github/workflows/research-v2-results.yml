name: Research V2 Results and Movement
on:
  workflow_dispatch:
  schedule:
    # 08:00 Bangkok daily: previous football day is normally complete.
    - cron: '0 1 * * *'
permissions:
  contents: write
concurrency:
  group: research-v2-results
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Exact-ID finished result backfill
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m odds_scanner.research_v2_results
      - name: Build movement features
        run: python -m odds_scanner.research_v2_movement
      - name: Persist Research V2 derived data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/normalized/oddspapi_finished_results.jsonl data/normalized/research_v2_movement_features.jsonl reports/research_v2_result_backfill_status.json reports/research_v2_movement_status.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update Research V2 results and movement [skip ci]'
          git push
