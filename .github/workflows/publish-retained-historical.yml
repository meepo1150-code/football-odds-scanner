name: Publish Retained Historical Artifact
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing Manual Historical Scan run; no provider requests'
        type: string
        required: true
      allow_runtime_partial:
        description: 'Import only verified results from a runtime-budget stop; preserve incomplete scan status'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: historical-retained-artifact-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
      ALLOW_PARTIAL: ${{ inputs.allow_runtime_partial }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Download retained source artifact; no collector or provider credentials
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          source_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.path')"
          test "$source_path" = '.github/workflows/manual-historical-scan.yml'
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | [.name, (.id | tostring)] | @tsv' | awk -F '\t' -v run="$SOURCE_RUN" '$1 ~ ("^manual-historical-" run "-[0-9]+$") {print $2}' | head -n1)"
          test -n "$artifact_id"
          curl --fail-with-body --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o /tmp/retained-history.zip
          mkdir retained-history
          unzip -q /tmp/retained-history.zip -d retained-history
      - name: Validate and import retained results offline
        run: |
          set -euo pipefail
          flags=()
          if [ "$ALLOW_PARTIAL" = true ]; then flags+=(--allow-runtime-partial); fi
          python scripts/publish_manual_historical.py --artifact-dir retained-history \
            --expected-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" "${flags[@]}"
          python -m odds_scanner.research_v2_evidence
      - name: Publish on fresh main without overwriting concurrent observations
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          flags=()
          if [ "$ALLOW_PARTIAL" = true ]; then flags+=(--allow-runtime-partial); fi
          for attempt in 1 2 3; do
            git add data/normalized/europe_pinnacle_research_v2_snapshots.jsonl \
              data/normalized/research_v2_pattern_outcomes.jsonl reports/research_v2_pattern_statistics.json \
              reports/manual_historical_promotion_latest.json reports/dashboard_scope.json \
              reports/research_v2_missing_ft_ledger.json reports/research_v2_fixture_identity.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: publish retained historical artifact with explicit coverage [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_manual_historical.py --artifact-dir retained-history \
              --expected-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" "${flags[@]}"
            python -m odds_scanner.research_v2_evidence
          done
      - name: Dispatch Dashboard deployment
        run: gh workflow run pages.yml --ref main
