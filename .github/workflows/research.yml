name: Odds Research Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'data/normalized/history.csv'
      - 'reports/backtest.json'
      - 'reports/audit.json'
      - 'reports/today.json'
      - 'reports/data_provenance.json'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 5'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Historical integration run
        if: github.event_name != 'pull_request'
        run: python -m odds_scanner.pipeline
      - name: Audit train-test consistency
        if: github.event_name != 'pull_request'
        run: python -m odds_scanner.audit
      - name: Attempt current fixture scan
        if: github.event_name != 'pull_request'
        run: python -c "from pathlib import Path; from odds_scanner.scanner import scan; print(scan(Path('.'))['qualifying'])" || true
      - name: Commit generated research outputs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/normalized/history.csv reports/backtest.json reports/audit.json reports/data_provenance.json
          if test -f reports/today.json; then git add -- reports/today.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Update odds research outputs'
          git push
