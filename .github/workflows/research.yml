name: Odds Research Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 5'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m odds_scanner.pipeline
      - name: Attempt current fixture scan
        run: python -c "from pathlib import Path; from odds_scanner.scanner import scan; print(scan(Path('.'))['qualifying'])" || true
      - name: Commit generated research outputs
        run: |
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/normalized/history.csv reports/backtest.json reports/today.json data/raw/fixtures.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Update odds research outputs'
          git push
