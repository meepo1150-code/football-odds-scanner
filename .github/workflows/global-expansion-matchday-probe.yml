name: Global Expansion Matchday Price Probe
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Research-only mode; expansion requires cache calibration PASS
        type: choice
        options: [revalidate, expand]
        default: revalidate
  workflow_run:
    workflows: ['Daily Preparation Scan']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: research-v2-collectors
  cancel-in-progress: false
env:
  RESEARCH_QUOTA_DURABLE: 'true'
jobs:
  probe:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.run_attempt == 1 &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: One-off authorized matchday only
        id: day
        run: |
          if test "$(TZ=Asia/Bangkok date +%F)" = '2026-10-15'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.day.outputs.enabled == 'true'
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
        if: steps.day.outputs.enabled == 'true'
      - name: Verify staged identity evidence before any price request
        if: steps.day.outputs.enabled == 'true'
        run: python data/research/global_expansion_readiness/build.py
      - name: Audit all leagues against the actual 15:00 fixture receipt
        if: steps.day.outputs.enabled == 'true'
        run: python data/research/global_expansion_readiness/audit.py --football-day 2026-10-15
      - name: At most one price request after matchday identity and shared quota gates
        if: steps.day.outputs.enabled == 'true'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python data/research/global_expansion_readiness/probe.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.day.outputs.enabled == 'true'
        with:
          name: global-expansion-matchday-probe-${{ github.run_id }}
          path: |
            reports/global_expansion_readiness.json
            reports/global_expansion_matchday_probe.json
            data/research/global_expansion_probe/*.json
          retention-days: 30
      - name: Publish only the probe report; preserve all production histories
        if: steps.day.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          report=reports/global_expansion_matchday_probe.json
          test -f "$report" || exit 0
          cp "$report" /tmp/global-expansion-probe.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/global-expansion-probe.json "$report"
            git add -- "$report"
            git diff --cached --quiet && exit 0
            git commit -m 'data: bounded expansion matchday probe report [skip ci]'
            git push origin HEAD:main && exit 0
          done
          exit 1
# No new activation, scan scheduler changes or production price/FT/fixture writes.
# The shared quota reservation is committed before any metered request. No retries.

# Manual offline calibration only. No provider credentials or network calls.
  historical-revalidate:
    permissions: {contents: read}
    concurrency: {group: historical-research-isolated-manual, cancel-in-progress: false}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/historical-backfill-isolated-20261015'
    environment: historical-research
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
      PILOT_ENVIRONMENT: historical-research
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Offline safety and representative price tests
        run: python -m unittest discover -s research/historical_backfill -p 'test_*.py'
      - uses: actions/cache/restore@v4
        with:
          path: |
            research/historical_backfill/data/raw
            research/historical_backfill/data/cache
          key: historical-pilot-v1-${{ github.run_id }}
          restore-keys: historical-pilot-v1-
          fail-on-cache-miss: true
      - name: Replay all ten calibration fixtures without provider calls
        run: python -m research.historical_backfill.revalidate
      - uses: actions/checkout@v6
        if: inputs.mode == 'expand'
        with:
          ref: main
          path: production-state
          persist-credentials: false
      - name: Install research dependencies
        if: inputs.mode == 'expand'
        run: python -m pip install -e .
      - name: Fresh read-only production health safety gate
        if: inputs.mode == 'expand'
        run: python -m research.historical_backfill.health_preflight
      - name: Production identity and quota baseline; account only
        id: production_baseline
        if: inputs.mode == 'expand'
        env:
          ACCOUNT_PROBE_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m research.historical_backfill.actions_pilot production-before
      - name: Controlled expansion to 100; ten calibration fixtures cache-only
        if: inputs.mode == 'expand'
        env:
          HISTORICAL_ODDSPAPI_KEY: ${{ secrets.HISTORICAL_ODDSPAPI_KEY }}
          PILOT_ALLOW_EXPANSION: 'true'
          PILOT_MIN_CACHED_FIXTURES: '93'
        run: python -m research.historical_backfill.actions_pilot pilot --expand
      - name: Verify production quota unchanged
        if: always() && inputs.mode == 'expand' && steps.production_baseline.outcome == 'success'
        env:
          ACCOUNT_PROBE_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m research.historical_backfill.actions_pilot production-after
      - name: Preserve immutable cache even after partial stop
        if: always() && inputs.mode == 'expand' && hashFiles('research/historical_backfill/data/cache/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            research/historical_backfill/data/raw
            research/historical_backfill/data/cache
          key: historical-pilot-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-price-quality-${{ github.run_id }}
          path: |
            research/historical_backfill/data/quality
            research/historical_backfill/data/actions/*.json
            research/historical_backfill/data/raw
            research/historical_backfill/data/cache
          retention-days: 30
