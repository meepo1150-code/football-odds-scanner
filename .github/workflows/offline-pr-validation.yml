name: Offline PR Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: offline-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Full offline regression suite
        run: python -m pytest -q
      - name: Research V2 all-snapshot AH and O/U coverage audit (no provider requests)
        run: PYTHONPATH=src python scripts/audit_ou_multimarket_coverage.py
      - name: Existing master integrity
        run: |
          python data/master/validate_uefa_master.py
          python -m unittest discover -s data/master -p 'test_uefa_registry.py' -v
