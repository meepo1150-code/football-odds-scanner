name: Manual Historical Scan (Thai Time)
on:
  workflow_dispatch:
    inputs:
      start_day:
        description: 'Football day start in Thailand (YYYY-MM-DD); 00:00-05:59 belongs to previous day'
        type: string
        required: true
      end_day:
        description: 'Football day end in Thailand (YYYY-MM-DD), inclusive, maximum 7 days'
        type: string
        required: true
      times_thai:
        description: 'Thai target times HH:MM, comma-separated; early morning means next calendar day'
        type: string
        default: '15:00,18:00,21:00,00:00'
        required: true
      bookmakers:
        description: 'Verified native bookmaker evidence only'
        type: choice
        options: [pinnacle, bet365, 'pinnacle,bet365']
        default: pinnacle
      mode:
        description: 'Plan never calls provider; recover fetches only cache misses'
        type: choice
        options: [plan, cache-only, recover]
        default: plan
      publish_to_dashboard:
        description: 'After clean completed scan, import verified historical slots and rebuild statistics/dashboard'
        type: boolean
        default: true
      confirm_live_requests:
        description: 'Authorize dedicated historical-key requests; publishing is separately validated'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-research-isolated-manual
  cancel-in-progress: false
jobs:
  historical:
    if: github.ref == 'refs/heads/main'
    environment: historical-research
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PILOT_ENVIRONMENT: historical-research
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Offline time and safety tests; no provider secrets
        run: python -m pytest -q tests/test_manual_historical.py
      - uses: actions/cache/restore@v4
        id: history_cache
        with:
          path: |
            research/historical_backfill/data/raw
            research/historical_backfill/data/cache
          key: historical-manual-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: historical-manual-v1-
      - name: Bootstrap reviewed prior experiment cache when no manual cache exists
        if: steps.history_cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38867737713 -R "$GITHUB_REPOSITORY" -n sep15-17-football-day-recovery-38867737713-football-day -D historical-seed
          python -m odds_scanner.historical_manual.seed --directory historical-seed
      - name: Plan or recover with Thai targets; historical key only
        env:
          HISTORICAL_ODDSPAPI_KEY: ${{ inputs.mode == 'recover' && inputs.confirm_live_requests && secrets.HISTORICAL_ODDSPAPI_KEY || '' }}
          ACCOUNT_PROBE_KEY: ${{ inputs.mode == 'recover' && inputs.confirm_live_requests && secrets.ODDSPAPI_KEY || '' }}
          INPUT_START: ${{ inputs.start_day }}
          INPUT_END: ${{ inputs.end_day }}
          INPUT_TIMES: ${{ inputs.times_thai }}
          INPUT_BOOKS: ${{ inputs.bookmakers }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm_live_requests }}
        run: |
          set -euo pipefail
          confirm=()
          if [ "$INPUT_CONFIRM" = true ]; then confirm+=(--confirm-live-requests); fi
          python -m odds_scanner.historical_manual.runner --start-day "$INPUT_START" --end-day "$INPUT_END" --times "$INPUT_TIMES" --bookmakers "$INPUT_BOOKS" --mode "$INPUT_MODE" "${confirm[@]}"
      - name: Verify production checkout inputs remain unchanged
        if: always()
        run: git diff --exit-code -- data reports config
      - uses: actions/cache/save@v4
        if: always() && hashFiles('research/historical_backfill/data/cache/*.json') != '' && (steps.history_cache.outputs.cache-matched-key == '' || hashFiles('research/manual_historical/output/new_cache/cache/*.json') != '')
        with:
          path: |
            research/historical_backfill/data/raw
            research/historical_backfill/data/cache
          key: historical-manual-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-historical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/manual_historical/output
          retention-days: 90
          if-no-files-found: warn

  publish:
    needs: historical
    if: ${{ needs.historical.result == 'success' && inputs.publish_to_dashboard && inputs.mode != 'plan' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out latest main before publishing
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Fetch exact historical scan artifact
        id: artifact_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolve an existing artifact by run ID, even when this publish job
          # is rerun at another attempt. Never invoke the historical collector.
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | [.name, (.id | tostring)] | @tsv' | awk -F '\t' -v run="$GITHUB_RUN_ID" '$1 ~ ("^manual-historical-" run "-[0-9]+$") {print $2}' | head -n1)"
          if [ -z "$artifact_id" ]; then
            echo "::error::No retained historical artifact for run $GITHUB_RUN_ID"
            exit 1
          fi
          echo "Replaying verified run $GITHUB_RUN_ID artifact ID $artifact_id (zero provider requests)"
          curl --fail-with-body --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o /tmp/historical-publish.zip
          mkdir -p manual-publish-artifact
          unzip -q /tmp/historical-publish.zip -d manual-publish-artifact
          test -s manual-publish-artifact/report.json
          test -s manual-publish-artifact/manifest.json
          python -m odds_scanner.historical_manual.publish_gate \
            --report manual-publish-artifact/report.json --run-id "$GITHUB_RUN_ID"
      - name: Validate, import, and rebuild main statistics (offline)
        if: steps.artifact_gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python scripts/publish_manual_historical.py --artifact-dir manual-publish-artifact
          python -m odds_scanner.research_v2_evidence
      - name: Commit data and regenerated statistics, preserving other main changes
        if: steps.artifact_gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/normalized/europe_pinnacle_research_v2_snapshots.jsonl \
            data/normalized/research_v2_pattern_outcomes.jsonl \
            reports/research_v2_pattern_statistics.json \
            reports/manual_historical_promotion_latest.json \
            reports/dashboard_scope.json \
            reports/research_v2_missing_ft_ledger.json \
            reports/research_v2_fixture_identity.json
          if git diff --cached --quiet; then
            echo 'No content changed'
          else
            git commit -m "data: publish manual historical reconstruction and refreshed stats [skip ci]"
            git push origin HEAD:main
          fi
      - name: Explicitly dispatch Pages deployment after publish
        if: steps.artifact_gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger downstream push workflows.
          gh workflow run pages.yml --ref main
