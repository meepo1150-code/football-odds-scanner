name: Historical Research Manual Calibration
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
# Manual offline calibration only. No provider credentials or network calls.
  historical-revalidate:
    permissions: {contents: read}
    concurrency: {group: historical-research-isolated-manual, cancel-in-progress: false}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/historical-backfill-isolated-20261015'
    environment: historical-research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      PILOT_ENVIRONMENT: historical-research
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Offline safety and representative price tests
        run: python -m unittest discover -s research/historical_backfill -p 'test_*.py'
      - uses: actions/cache/restore@v4
        with:
          path: |
            research/historical_backfill/data/raw
            research/historical_backfill/data/cache
          key: historical-pilot-v1-${{ github.run_id }}
          restore-keys: historical-pilot-v1-
          fail-on-cache-miss: true
      - name: Replay all ten calibration fixtures without provider calls
        run: python -m research.historical_backfill.revalidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-price-quality-${{ github.run_id }}
          path: |
            research/historical_backfill/data/quality
            research/historical_backfill/data/raw
            research/historical_backfill/data/cache
          retention-days: 30
