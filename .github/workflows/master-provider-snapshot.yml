name: Football Master Provider Identity Snapshot
on:
  push:
    branches: ['feature/league-selection-v1-20261008']
    paths: ['controls/master_provider_snapshot.txt']
permissions:
  contents: write
concurrency:
  group: master-provider-identity-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_master_provider_snapshot.py
      - name: Read account and collect at most three identity requests
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m odds_scanner.master_provider_snapshot --lookback
      - name: Save evidence to the feature branch only
        run: |
          set -euo pipefail
          cp reports/master_provider_snapshot.json /tmp/master_provider_snapshot.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feature/league-selection-v1-20261008
          git reset --hard origin/feature/league-selection-v1-20261008
          cp /tmp/master_provider_snapshot.json reports/master_provider_snapshot.json
          git add reports/master_provider_snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: bounded live master provider identity evidence [skip ci]'
          git push origin HEAD:feature/league-selection-v1-20261008
