name: YouTube prediction isolated tests
on:
  pull_request:
    paths:
      - 'youtube_prediction/**'
      - 'tests/test_youtube_prediction_pipeline.py'
      - '.github/workflows/youtube-prediction-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests -p test_youtube_prediction_pipeline.py -v
