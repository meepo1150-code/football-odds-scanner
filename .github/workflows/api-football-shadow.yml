name: API-Football Result Identity Guard
on:
  workflow_dispatch:
  schedule:
    # Bangkok 06:40 and 18:40. Keeps fixture/result identity cached before the Free-plan history window expires.
    - cron: '40 23,11 * * *'
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/api_football_provider.py'
      - 'src/odds_scanner/pinnwire_result_join.py'
      - 'src/odds_scanner/web_result_recovery.py'\n      - 'src/odds_scanner/web_result_evidence.py'\n      - 'data/research/web_result_evidence.jsonl'\n      - 'tests/test_web_result_evidence.py'
      - 'tests/test_web_result_recovery.py'
      - 'tests/test_api_football_provider.py'
      - '.github/workflows/api-football-shadow.yml'
permissions:
  contents: write
concurrency:
  group: api-football-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Test API-Football adapter
        run: pytest -q tests/test_api_football_provider.py tests/test_web_result_recovery.py tests/test_web_result_evidence.py tests/test_pinnwire_exact_result_bridge.py
      - name: Collect global fixture and FT result data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_ODDS_PROBE: 'false'
          API_FOOTBALL_V2_SCAN: 'false'
          RESEARCH_V2_FORCE_TARGET_AT: ''
        run: python -m odds_scanner.api_football_provider
      - name: Fetch fixture results for PinnWire missing dates
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_PINNWIRE_BACKFILL_MAX_DAYS: '0'
        run: python -c "from odds_scanner.api_football_provider import collect_missing_pinnwire_days; import json; print(json.dumps(collect_missing_pinnwire_days(), ensure_ascii=False))"
      - name: Build zero-quota web result recovery queue
        run: python -m odds_scanner.web_result_recovery
      - name: Join finished API-Football results to PinnWire and settle AH
        run: python -m odds_scanner.pinnwire_result_join
      - name: Rebuild AH and O-U statistics
        run: python -m odds_scanner.research_v2_pattern_stats
      - name: Persist result data and rebuilt statistics
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/api-football-shadow/reports /tmp/api-football-shadow/data/normalized
          test -f reports/api_football_shadow_health.json && cp reports/api_football_shadow_health.json /tmp/api-football-shadow/reports/ || true
          test -f reports/api_football_pinnwire_backfill.json && cp reports/api_football_pinnwire_backfill.json /tmp/api-football-shadow/reports/ || true
          test -f reports/pinnwire_web_result_recovery_queue.json && cp reports/pinnwire_web_result_recovery_queue.json /tmp/api-football-shadow/reports/ || true
          cp data/normalized/api_football_fixtures.jsonl /tmp/api-football-shadow/data/normalized/
          test -f data/normalized/pinnwire_research_v2_settlements.jsonl && cp data/normalized/pinnwire_research_v2_settlements.jsonl /tmp/api-football-shadow/data/normalized/ || true
          test -f data/normalized/oddspapi_finished_results.jsonl && cp data/normalized/oddspapi_finished_results.jsonl /tmp/api-football-shadow/data/normalized/ || true
          test -f reports/pinnwire_result_join_status.json && cp reports/pinnwire_result_join_status.json /tmp/api-football-shadow/reports/ || true
          test -f reports/research_v2_pattern_statistics.json && cp reports/research_v2_pattern_statistics.json /tmp/api-football-shadow/reports/ || true
          test -f data/normalized/research_v2_pattern_outcomes.jsonl && cp data/normalized/research_v2_pattern_outcomes.jsonl /tmp/api-football-shadow/data/normalized/ || true
          test ! -f data/normalized/oddspapi_finished_results.conflicts.jsonl || cp data/normalized/oddspapi_finished_results.conflicts.jsonl /tmp/api-football-shadow/data/normalized/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            test -f /tmp/api-football-shadow/reports/api_football_shadow_health.json && cp /tmp/api-football-shadow/reports/api_football_shadow_health.json reports/ || true
            test -f /tmp/api-football-shadow/reports/api_football_pinnwire_backfill.json && cp /tmp/api-football-shadow/reports/api_football_pinnwire_backfill.json reports/ || true
            test -f /tmp/api-football-shadow/reports/pinnwire_web_result_recovery_queue.json && cp /tmp/api-football-shadow/reports/pinnwire_web_result_recovery_queue.json reports/ || true
            cp /tmp/api-football-shadow/data/normalized/api_football_fixtures.jsonl data/normalized/
            python -m odds_scanner.result_artifact_merge /tmp/api-football-shadow
            python -m odds_scanner.pinnwire_result_join
            python -m odds_scanner.research_v2_pattern_stats
            git add -f -- reports/api_football_shadow_health.json reports/api_football_pinnwire_backfill.json reports/pinnwire_web_result_recovery_queue.json reports/pinnwire_result_join_status.json data/normalized/api_football_fixtures.jsonl data/normalized/pinnwire_research_v2_settlements.jsonl data/normalized/oddspapi_finished_results.jsonl reports/research_v2_pattern_statistics.json data/normalized/research_v2_pattern_outcomes.jsonl
            test ! -f data/normalized/oddspapi_finished_results.conflicts.jsonl || git add -f data/normalized/oddspapi_finished_results.conflicts.jsonl
            git diff --cached --quiet && exit 0
            git commit -m 'data: update API-Football results and PinnWire settlements'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
# This is an isolated shadow feed. It never joins API-Football IDs to OddsPapi IDs by team names.
# Each regular collection uses 4 requests: yesterday, today, tomorrow fixtures, and account status.
# Scheduled identity/result guard. Two runs/day keep current fixtures and FT evidence inside the Free-plan date window.
# Odds remain disabled until Big-5 coverage and market/timestamp semantics are audited.
