name: API-Football Shadow Fixture and Result Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/api_football_provider.py'
      - 'src/odds_scanner/pinnwire_result_join.py'
      - 'tests/test_api_football_provider.py'
      - '.github/workflows/api-football-shadow.yml'
  schedule:
    - cron: '10 8 * * *'
permissions:
  contents: write
concurrency:
  group: api-football-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Test API-Football adapter
        run: pytest -q tests/test_api_football_provider.py
      - name: Collect global fixture and FT result data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_ODDS_PROBE: 'false'
          API_FOOTBALL_V2_SCAN: 'false'
          RESEARCH_V2_FORCE_TARGET_AT: ''
        run: python -m odds_scanner.api_football_provider
      - name: Join finished API-Football results to PinnWire and settle AH
        run: python -m odds_scanner.pinnwire_result_join
      - name: Persist shadow health without mixing provider identities
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/api-football-shadow/reports /tmp/api-football-shadow/data/normalized
          test -f reports/api_football_shadow_health.json && cp reports/api_football_shadow_health.json /tmp/api-football-shadow/reports/ || true
          cp reports/europe_pinnacle_research_v2_status.json /tmp/api-football-shadow/reports/
          cp data/normalized/europe_pinnacle_research_v2_snapshots.jsonl /tmp/api-football-shadow/data/normalized/
          cp reports/api_football_odds_probe.json /tmp/api-football-shadow/reports/
          cp data/normalized/api_football_fixtures.jsonl /tmp/api-football-shadow/data/normalized/
          test -f data/normalized/pinnwire_research_v2_settlements.jsonl && cp data/normalized/pinnwire_research_v2_settlements.jsonl /tmp/api-football-shadow/data/normalized/ || true
          test -f data/normalized/oddspapi_finished_results.jsonl && cp data/normalized/oddspapi_finished_results.jsonl /tmp/api-football-shadow/data/normalized/ || true
          test -f reports/pinnwire_result_join_status.json && cp reports/pinnwire_result_join_status.json /tmp/api-football-shadow/reports/ || true
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            test -f /tmp/api-football-shadow/reports/api_football_shadow_health.json && cp /tmp/api-football-shadow/reports/api_football_shadow_health.json reports/ || true
            cp /tmp/api-football-shadow/reports/europe_pinnacle_research_v2_status.json reports/
            cp /tmp/api-football-shadow/data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/
            cp /tmp/api-football-shadow/reports/api_football_odds_probe.json reports/
            cp /tmp/api-football-shadow/data/normalized/api_football_fixtures.jsonl data/normalized/
            test -f /tmp/api-football-shadow/data/normalized/pinnwire_research_v2_settlements.jsonl && cp /tmp/api-football-shadow/data/normalized/pinnwire_research_v2_settlements.jsonl data/normalized/ || true
            test -f /tmp/api-football-shadow/data/normalized/oddspapi_finished_results.jsonl && cp /tmp/api-football-shadow/data/normalized/oddspapi_finished_results.jsonl data/normalized/ || true
            test -f /tmp/api-football-shadow/reports/pinnwire_result_join_status.json && cp /tmp/api-football-shadow/reports/pinnwire_result_join_status.json reports/ || true
            git add -f -- reports/api_football_shadow_health.json reports/api_football_odds_probe.json reports/europe_pinnacle_research_v2_status.json reports/pinnwire_result_join_status.json data/normalized/api_football_fixtures.jsonl data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/pinnwire_research_v2_settlements.jsonl data/normalized/oddspapi_finished_results.jsonl
            git diff --cached --quiet && exit 0
            git commit -m 'data: update API-Football results and PinnWire settlements'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
# This is an isolated shadow feed. It never joins API-Football IDs to OddsPapi IDs by team names.
# It uses 3 requests/day: previous date fixtures, current date fixtures, and account status.
# Odds remain disabled until Big-5 coverage and market/timestamp semantics are audited.
