name: API-Football Shadow Fixture and Result Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/api_football_provider.py'
      - 'tests/test_api_football_provider.py'
      - '.github/workflows/api-football-shadow.yml'
  schedule:
    - cron: '10 8 * * *'
permissions:
  contents: write
concurrency:
  group: api-football-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Test API-Football adapter
        run: pytest -q tests/test_api_football_provider.py
      - name: Collect isolated Big-5 fixture and FT shadow data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m odds_scanner.api_football_provider
      - name: Persist shadow health without mixing provider identities
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/api-football-shadow/reports /tmp/api-football-shadow/data/normalized
          cp reports/api_football_shadow_health.json /tmp/api-football-shadow/reports/
          cp data/normalized/api_football_fixtures.jsonl /tmp/api-football-shadow/data/normalized/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            cp /tmp/api-football-shadow/reports/api_football_shadow_health.json reports/
            cp /tmp/api-football-shadow/data/normalized/api_football_fixtures.jsonl data/normalized/
            git add -f -- reports/api_football_shadow_health.json data/normalized/api_football_fixtures.jsonl
            git diff --cached --quiet && exit 0
            git commit -m 'data: update API-Football shadow health [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
# This is an isolated shadow feed. It never joins API-Football IDs to OddsPapi IDs by team names.
# It uses 3 requests/day: previous date fixtures, current date fixtures, and account status.
# Odds remain disabled until Big-5 coverage and market/timestamp semantics are audited.
