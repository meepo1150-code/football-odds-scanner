name: Current Multi-Market Provider Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/sgodds_provider.py'
      - 'tests/test_sgodds_provider.py'
      - '.github/workflows/provider-health.yml'
  schedule:
    - cron: '15 2 * * *'
concurrency:
  group: odds-scanner-provider-health
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  provider-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Probe live multi-market provider
        if: github.event_name != 'pull_request'
        run: python -m odds_scanner.sgodds_provider
      - name: Commit provider health only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/current_provider_health.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update current provider health'
          git pull --rebase origin main
          git push
