name: Current Multi-Market Provider Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/sgodds_provider.py'
      - 'src/odds_scanner/provider_capabilities.py'
      - 'src/odds_scanner/source_qualification.py'
      - 'tests/test_sgodds_provider.py'
      - 'tests/test_provider_capabilities.py'
      - 'tests/test_source_qualification.py'
      - '.github/workflows/provider-health.yml'
  schedule:
    - cron: '15 2 * * *'
concurrency:
  group: odds-scanner-provider-health
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  provider-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Write provider capability matrix
        if: github.event_name != 'pull_request'
        run: python -c "from pathlib import Path; from odds_scanner.provider_capabilities import write_capability_matrix; write_capability_matrix(Path('reports/provider_capabilities.json'))"
      - name: Write source qualification report
        if: github.event_name != 'pull_request'
        run: python -c "from pathlib import Path; from odds_scanner.source_qualification import write_report; write_report(Path('reports/source_qualification.json'))"
      - name: Probe live opening provider
        if: github.event_name != 'pull_request'
        run: python -m odds_scanner.sgodds_provider
      - name: Commit provider health, capabilities and qualification
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/current_provider_health.json reports/provider_capabilities.json reports/source_qualification.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update provider health and qualification'
          git pull --rebase origin main
          git push
