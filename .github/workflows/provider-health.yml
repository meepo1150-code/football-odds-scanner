name: Current Multi-Market Provider Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/sgodds_provider.py'
      - 'src/odds_scanner/infersports_provider.py'
      - 'src/odds_scanner/five_dollar_provider.py'
      - 'src/odds_scanner/provider_capabilities.py'
      - 'src/odds_scanner/source_qualification.py'
      - 'tests/test_sgodds_provider.py'
      - 'tests/test_infersports_provider.py'
      - 'tests/test_five_dollar_provider.py'
      - 'tests/test_provider_capabilities.py'
      - 'tests/test_source_qualification.py'
      - '.github/workflows/provider-health.yml'
  schedule:
    - cron: '15 2 * * *'
concurrency:
  group: odds-scanner-provider-health
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  provider-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Write provider capability matrix
        run: python -c "from pathlib import Path; from odds_scanner.provider_capabilities import write_capability_matrix; write_capability_matrix(Path('reports/provider_capabilities.json'))"
      - name: Write source qualification report
        run: python -c "from pathlib import Path; from odds_scanner.source_qualification import write_report; write_report(Path('reports/source_qualification.json'))"
      - name: Probe free-key Bet365 provider and account plan
        run: python -c "from pathlib import Path; from odds_scanner.five_dollar_provider import write_health; print(write_health(Path('.')))"
      - name: Probe live opening provider
        run: python -m odds_scanner.sgodds_provider
      - name: Probe keyless current-price candidate
        run: python -m odds_scanner.infersports_provider
      - name: Commit provider health without generated-file rebase conflicts
        run: |
          set -euo pipefail
          mkdir -p /tmp/provider-health
          for f in current_provider_health.json infersports_health.json five_dollar_health.json provider_capabilities.json source_qualification.json; do
            cp "reports/$f" "/tmp/provider-health/$f"
          done
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp /tmp/provider-health/*.json reports/
            git add -- reports/current_provider_health.json reports/infersports_health.json reports/five_dollar_health.json reports/provider_capabilities.json reports/source_qualification.json
            git diff --cached --quiet && exit 0
            git commit -m 'Update provider health and qualification'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying from latest main"
          done
          exit 1
