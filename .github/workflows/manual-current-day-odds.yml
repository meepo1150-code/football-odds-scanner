name: Manual Current-Day Odds Observation
on:
  workflow_dispatch:
    inputs:
      confirm_live_requests:
        description: 'Authorize quota-controlled live odds requests for the current eligible slot'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: research-v2-collectors
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ inputs.confirm_live_requests == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      RESEARCH_QUOTA_DURABLE: 'true'
      RESEARCH_V2_MANUAL_UNRESTRICTED: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Collect current eligible slot only (never backdate prices)
        run: |
          set -euo pipefail
          export RESEARCH_V2_MANUAL_BREADTH=true RESEARCH_V2_FORCE_RUN=true
          export RESEARCH_V2_FORCE_TARGET_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m odds_scanner.europe_pinnacle_discovery
      - name: Preserve and publish observation evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          paths=(data/normalized/europe_pinnacle_research_v2_snapshots.jsonl data/normalized/europe_pinnacle_research_v2_audit.jsonl data/normalized/research_v2_slot_ledger.jsonl reports/europe_pinnacle_research_v2_status.json reports/scan_health_latest.json reports/scan_health_monitor.json data/normalized/research_v2_quota_reservations.jsonl)
          mkdir -p /tmp/manual-observation
          for path in "${paths[@]}"; do
            if test -f "$path"; then mkdir -p "/tmp/manual-observation/$(dirname "$path")"; cp "$path" "/tmp/manual-observation/$path"; fi
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for path in "${paths[@]}"; do
              if test -f "/tmp/manual-observation/$path"; then
                mkdir -p "$(dirname "$path")"
                case "$path" in
                  *.jsonl)
                    python - "$path" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); incoming=Path('/tmp/manual-observation')/p
          existing=p.read_text().splitlines() if p.exists() else []
          seen=set(existing)
          with p.open('a',encoding='utf-8') as out:
              for line in incoming.read_text().splitlines():
                  if line.strip() and line not in seen:
                      json.loads(line)
                      out.write(line+chr(10))
                      seen.add(line)
          PY
                    ;;
                  *) cp "/tmp/manual-observation/$path" "$path";;
                esac
              fi
            done
            git add -f -- "${paths[@]}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: manual current-day odds observation [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
