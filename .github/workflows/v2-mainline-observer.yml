name: Validation v2 Main-Line Observer
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *'
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/v2_mainline_observer.py'
      - 'src/odds_scanner/v2_tournament_diagnostics.py'
      - 'src/odds_scanner/v2_forward_entries.py'
      - 'src/odds_scanner/v2_forward_clv.py'
      - 'src/odds_scanner/v2_forward_readiness.py'
      - 'tests/test_v2_mainline_observer.py'
      - 'tests/test_v2_forward_entries.py'
      - 'tests/test_v2_forward_clv.py'
      - 'tests/test_v2_forward_readiness.py'
      - 'reports/v2_research_candidates.json'
      - 'reports/v2_forward_preregistration.json'
      - 'reports/v2_target_tournaments.json'
      - 'data/normalized/oddspapi_market_catalog.json'
      - '.github/workflows/v2-mainline-observer.yml'
permissions:
  contents: write
concurrency:
  group: validation-v2-mainline-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - name: Verify v2 observation, entry, CLV, and readiness contracts
        run: pytest -q tests/test_v2_mainline_observer.py tests/test_v2_research_shadow.py tests/test_v2_forward_entries.py tests/test_v2_forward_clv.py tests/test_v2_forward_readiness.py
      - name: Capture provider metadata before another discovery call
        run: python -m odds_scanner.v2_tournament_diagnostics
      - name: Observe current Bet365 main lines across both v2 universes
        run: |
          rm -f reports/v2_mainline_observer.json
          python -m odds_scanner.v2_mainline_observer | tee /tmp/v2-mainline-observer-output.json
      - name: Build immutable forward-entry ledger
        run: python -m odds_scanner.v2_forward_entries
      - name: Refresh cadence-limited forward CLV
        run: python -m odds_scanner.v2_forward_clv
      - name: Refresh frozen forward-readiness gates
        run: python -m odds_scanner.v2_forward_readiness
      - name: Persist observer-owned evidence safely
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-mainline
          if [ -f reports/v2_mainline_observer.json ]; then
            cp reports/v2_mainline_observer.json /tmp/v2-mainline/observer.json
          else
            cp /tmp/v2-mainline-observer-output.json /tmp/v2-mainline/observer.json
          fi
          if [ -f reports/v2_target_tournaments.json ]; then cp reports/v2_target_tournaments.json /tmp/v2-mainline/targets.json; fi
          if [ -f reports/v2_tournament_diagnostics.json ]; then cp reports/v2_tournament_diagnostics.json /tmp/v2-mainline/diagnostics.json; fi
          if [ -f reports/v2_forward_entry_status.json ]; then cp reports/v2_forward_entry_status.json /tmp/v2-mainline/forward-entry-status.json; fi
          if [ -f reports/v2_forward_clv_status.json ]; then cp reports/v2_forward_clv_status.json /tmp/v2-mainline/forward-clv-status.json; fi
          if [ -f reports/v2_forward_readiness.json ]; then cp reports/v2_forward_readiness.json /tmp/v2-mainline/forward-readiness.json; fi
          if [ -f data/normalized/v2_mainline_snapshots.jsonl ]; then cp data/normalized/v2_mainline_snapshots.jsonl /tmp/v2-mainline/snapshots.jsonl; fi
          if [ -f data/normalized/v2_forward_entries.jsonl ]; then cp data/normalized/v2_forward_entries.jsonl /tmp/v2-mainline/forward-entries.jsonl; fi
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports data/normalized
            cp /tmp/v2-mainline/observer.json reports/v2_mainline_observer.json
            if [ -f /tmp/v2-mainline/targets.json ]; then cp /tmp/v2-mainline/targets.json reports/v2_target_tournaments.json; fi
            if [ -f /tmp/v2-mainline/diagnostics.json ]; then cp /tmp/v2-mainline/diagnostics.json reports/v2_tournament_diagnostics.json; fi
            if [ -f /tmp/v2-mainline/forward-entry-status.json ]; then cp /tmp/v2-mainline/forward-entry-status.json reports/v2_forward_entry_status.json; fi
            if [ -f /tmp/v2-mainline/forward-clv-status.json ]; then cp /tmp/v2-mainline/forward-clv-status.json reports/v2_forward_clv_status.json; fi
            if [ -f /tmp/v2-mainline/forward-readiness.json ]; then cp /tmp/v2-mainline/forward-readiness.json reports/v2_forward_readiness.json; fi
            if [ -f /tmp/v2-mainline/snapshots.jsonl ]; then cp /tmp/v2-mainline/snapshots.jsonl data/normalized/v2_mainline_snapshots.jsonl; fi
            if [ -f /tmp/v2-mainline/forward-entries.jsonl ]; then cp /tmp/v2-mainline/forward-entries.jsonl data/normalized/v2_forward_entries.jsonl; fi
            for path in \
              reports/v2_mainline_observer.json \
              reports/v2_target_tournaments.json \
              reports/v2_tournament_diagnostics.json \
              reports/v2_forward_entry_status.json \
              reports/v2_forward_clv_status.json \
              reports/v2_forward_readiness.json \
              data/normalized/v2_mainline_snapshots.jsonl \
              data/normalized/v2_forward_entries.jsonl; do
              if [ -f "$path" ]; then git add -- "$path"; fi
            done
            git diff --cached --quiet && exit 0
            git commit -m '[skip ci] Update validation v2 forward evidence'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
          done
          exit 1

# Readiness reads the frozen preregistration gates verbatim and remains fail-closed.
# It adds no provider requests, cannot change candidate definitions, and can only
# report FORWARD_PAPER_CONFIRMED after every frozen gate passes. Even that status
# is explicitly not a production edge and still requires a separate post-forward audit.
