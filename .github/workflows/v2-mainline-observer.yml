name: Validation v2 Main-Line Observer
# Retired legacy scanner: no event triggers. Preserved for migration audit.
on:
  workflow_dispatch:
    inputs:
      retired_scanner_disabled:
        description: 'Retired legacy scanner; execution is blocked'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  group: validation-v2-mainline-observer
  cancel-in-progress: false
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Legacy scanner retired; no API calls'
