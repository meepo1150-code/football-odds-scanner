name: Assign provisional football master IDs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/assign_master_ids.py'
      - '.github/workflows/assign-master-ids.yml'
permissions:
  contents: read
jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/assign_master_ids.py
      - uses: actions/upload-artifact@v4
        with:
          name: football-provisional-master-ids
          path: data/master/provisional/
          retention-days: 30
