name: Research V2 Free Result Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['controls/research_v2_free_result_backfill_token.txt']
permissions:
  contents: write
concurrency:
  group: research-v2-free-result-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - name: Backfill matured Research V2 results without OddsPapi requests
        run: python -m odds_scanner.daily_fixture_result_backfill
      - name: Backfill matured forward results
        run: python -m odds_scanner.v2_forward_result_backfill
      - name: Refresh Research V2 statistics and readiness
        run: |
          python -m odds_scanner.v2_forward_performance
          python -m odds_scanner.research_v2_pattern_stats
          python -m odds_scanner.v2_forward_readiness
      - name: Persist result evidence and reports safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/free-result-backfill
          paths=(reports/research_v2_daily_result_backfill.json data/normalized/oddspapi_finished_results.jsonl data/normalized/v2_forward_settlements.jsonl reports/v2_forward_result_backfill.json reports/v2_forward_performance.json reports/v2_forward_readiness.json data/normalized/research_v2_pattern_outcomes.jsonl reports/research_v2_pattern_statistics.json)
          for path in "${paths[@]}"; do if test -e "$path"; then mkdir -p "/tmp/free-result-backfill/$(dirname "$path")"; cp "$path" "/tmp/free-result-backfill/$path"; fi; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for path in "${paths[@]}"; do if test -e "/tmp/free-result-backfill/$path"; then mkdir -p "$(dirname "$path")"; cp "/tmp/free-result-backfill/$path" "$path"; git add -f -- "$path"; fi; done
            git diff --cached --quiet && exit 0
            git commit -m 'data: free Research V2 result backfill [skip ci]'
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
# Zero OddsPapi requests. Uses persisted exact fixture mappings and exact/unique Research V2 identity bridge only.
