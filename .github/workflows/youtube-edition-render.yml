name: MatchLedger isolated edition render
on:
  push:
    branches: ['feature/youtube-production-v2-20261105']
    paths: ['youtube_prediction/**', '.github/workflows/youtube-edition-render.yml']
concurrency:
  group: matchledger-edition-20261105
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-urw-base35 espeak-ng
      - run: python -m pip install 'Pillow>=10,<13' numpy kokoro-onnx edge-tts
      - run: python -m unittest discover -s tests -p test_youtube_prediction_pipeline.py -v
      - name: Obtain local neural voice assets
        run: |
          mkdir voice
          curl -fL --retry 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/v1.0/kokoro-v1.0.onnx -o voice/model.onnx
          curl -fL --retry 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/v1.0/voices-v1.0.bin -o voice/voices.bin
      - run: python -m youtube_prediction.daily_v2 --episode youtube_prediction/episodes/2026-11-05 --output rendered --model voice/model.onnx --voices voice/voices.bin
      - uses: actions/upload-artifact@v4
        with:
          name: matchledger-2026-11-05
          path: rendered/
          retention-days: 7
