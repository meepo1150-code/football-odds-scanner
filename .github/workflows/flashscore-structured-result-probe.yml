name: Flashscore Structured Result Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/odds_scanner/flashscore_structured_probe.py'
      - 'tests/test_flashscore_structured_probe.py'
      - '.github/workflows/flashscore-structured-result-probe.yml'
permissions: {contents: write}
concurrency: {group: flashscore-structured-result-probe, cancel-in-progress: false}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_flashscore_structured_probe.py tests/test_flashscore_exact_probe.py
      - name: Probe structured result evidence from one exact event
        run: python -m odds_scanner.flashscore_structured_probe
      - name: Commit structured evidence report
        run: |
          set -euo pipefail
          git config user.name 'odds-scanner-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/flashscore_structured_result_probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Flashscore structured result probe [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

# Research-only. Stores compact structured metadata only, never raw page HTML.
# No CSS-selector scraping, fuzzy matching, or promotion effect.
