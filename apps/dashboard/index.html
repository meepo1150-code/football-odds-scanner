<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Odds Scanner</title>
<style>body{font-family:system-ui;margin:0;background:#0b1020;color:#edf2f7}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#151c30;border:1px solid #27314d;border-radius:14px;padding:18px;margin:14px 0}.muted{color:#9aa7bd}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #27314d;text-align:right}th:first-child,td:first-child{text-align:left}.good{color:#77e3a1}.warn{color:#ffd166}select{background:#151c30;color:#fff;padding:8px;border:1px solid #35415f;border-radius:8px}</style></head><body><div class="wrap"><h1>Football Odds Scanner</h1><p class="muted">Personal research dashboard · deterministic market backtest</p>
<div class="card"><h2>Backtest Gate</h2><div id="summary">Loading…</div></div>
<div class="card"><h2>1X2 Odds Lab</h2><label>Split <select id="split"><option>test</option><option>train</option></select></label> <label>Side <select id="side"><option>H</option><option>D</option><option>A</option></select></label><table><thead><tr><th>Odds</th><th>N</th><th>Win%</th><th>Market%</th><th>Gap pp</th><th>ROI</th><th>CLV</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card"><h2>Today</h2><div id="today">No scanner output yet.</div></div></div>
<script>
let data; const pct=x=>x==null?'—':(x*100).toFixed(2)+'%';
async function load(){data=await (await fetch('../../reports/backtest.json')).json(); document.getElementById('summary').innerHTML=`Rows: <b>${data.rows}</b> · Test seasons: <b>${data.test_seasons.join(', ')}</b><br><span class="warn">Positive historical ROI is not treated as validated edge.</span>`; render(); try{let t=await (await fetch('../../reports/today.json')).json();document.getElementById('today').textContent=t.qualifying?`${t.qualifying} candidates passed current research filters.`:'NO QUALIFYING MATCHES';}catch(e){}}
function render(){let sp=split.value,sd=side.value;let r=data.buckets.filter(x=>x.split===sp&&x.side===sd).sort((a,b)=>a.odds_low-b.odds_low);rows.innerHTML=r.map(x=>`<tr><td>${x.odds_low.toFixed(2)}–${x.odds_high.toFixed(2)}</td><td>${x.n}</td><td>${pct(x.win_rate)}</td><td>${pct(x.market_expected)}</td><td class="${x.calibration_gap_pp>0?'good':''}">${x.calibration_gap_pp.toFixed(2)}</td><td>${pct(x.flat_stake_roi)}</td><td>${pct(x.avg_clv)}</td></tr>`).join('')}
split.onchange=side.onchange=render;load();</script></body></html>
